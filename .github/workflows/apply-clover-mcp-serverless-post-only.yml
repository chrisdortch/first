name: Apply serverless-safe Clover MCP transport

on:
  push:
    branches:
      - platform/clover-context-gateway-v0.2.1-serverless-post-only-20260817
    paths:
      - '.github/workflows/apply-clover-mcp-serverless-post-only.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-clover-mcp-serverless-post-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'platform/clover-context-gateway-v0.2.1-serverless-post-only-20260817')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out isolated transport branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: platform/clover-context-gateway-v0.2.1-serverless-post-only-20260817

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/clover-context-gateway/package-lock.json

      - name: Patch the MCP route and add a regression test
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          server_path = Path('apps/clover-context-gateway/server.js')
          source = server_path.read_text()
          old = '''    if (url.pathname === MCP_PATH && ["GET", "POST", "DELETE"].includes(req.method || "")) {
                res.setHeader("access-control-allow-origin", allowedOrigin);
                res.setHeader("access-control-expose-headers", "Mcp-Session-Id");
                const server = createCloverServer(baseUrl);
                const transport = new StreamableHTTPServerTransport({ sessionIdGenerator: undefined, enableJsonResponse: true });
                res.on("close", () => {
                  transport.close();
                  server.close();
                });
                try {
                  await server.connect(transport);
                  await transport.handleRequest(req, res);
                } catch (error) {
                  console.error("MCP request failed", error);
                  if (!res.headersSent) json(res, 500, { error: "Internal MCP server error." });
                }
                return;
              }
          '''
          new = '''    if (url.pathname === MCP_PATH && ["GET", "DELETE"].includes(req.method || "")) {
                return json(
                  res,
                  405,
                  {
                    jsonrpc: "2.0",
                    error: {
                      code: -32000,
                      message: "Method not allowed. Use POST for this stateless serverless MCP endpoint.",
                    },
                    id: null,
                  },
                  { allow: "POST, OPTIONS" }
                );
              }

              if (url.pathname === MCP_PATH && req.method === "POST") {
                res.setHeader("access-control-allow-origin", allowedOrigin);
                res.setHeader("access-control-expose-headers", "Mcp-Session-Id");
                const server = createCloverServer(baseUrl);
                const transport = new StreamableHTTPServerTransport({ sessionIdGenerator: undefined, enableJsonResponse: true });
                res.on("close", () => {
                  transport.close();
                  server.close();
                });
                try {
                  await server.connect(transport);
                  await transport.handleRequest(req, res);
                } catch (error) {
                  console.error("MCP request failed", error);
                  if (!res.headersSent) json(res, 500, { error: "Internal MCP server error." });
                }
                return;
              }
          '''
          if old not in source:
              raise SystemExit('Expected MCP route block was not found; refusing to patch an unknown source state.')
          server_path.write_text(source.replace(old, new, 1))
          PY

          cat > apps/clover-context-gateway/test/serverless-mcp.test.js <<'NODE'
          import assert from "node:assert/strict";
          import { createServer } from "node:http";
          import test from "node:test";
          import { handler } from "../server.js";

          async function withGateway(run) {
            const server = createServer(handler);
            await new Promise((resolve, reject) => {
              server.once("error", reject);
              server.listen(0, "127.0.0.1", resolve);
            });
            const address = server.address();
            assert.ok(address && typeof address === "object");
            try {
              await run(`http://127.0.0.1:${address.port}`);
            } finally {
              await new Promise((resolve, reject) => {
                server.close((error) => (error ? reject(error) : resolve()));
              });
            }
          }

          for (const method of ["GET", "DELETE"]) {
            test(`${method} /mcp returns an immediate serverless-safe 405`, async () => {
              await withGateway(async (baseUrl) => {
                const started = Date.now();
                const response = await fetch(`${baseUrl}/mcp`, {
                  method,
                  headers: { accept: "text/event-stream" },
                });
                const elapsedMs = Date.now() - started;
                assert.equal(response.status, 405);
                assert.equal(response.headers.get("allow"), "POST, OPTIONS");
                assert.ok(elapsedMs < 2000, `Expected an immediate response, observed ${elapsedMs}ms`);
                const body = await response.json();
                assert.equal(body.jsonrpc, "2.0");
                assert.equal(body.id, null);
                assert.match(body.error?.message || "", /Use POST/);
              });
            });
          }
          NODE

      - name: Install and run all deterministic tests
        working-directory: apps/clover-context-gateway
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run validate

      - name: Prove POST MCP still works while GET terminates immediately
        shell: bash
        working-directory: apps/clover-context-gateway
        run: |
          set -euo pipefail
          PORT=8787 CONTEXT_SOURCE_MODE=local npm start > "$RUNNER_TEMP/clover-post-only.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/ > "$RUNNER_TEMP/root.json"; then break; fi
            sleep 1
          done
          status=$(curl --silent --output "$RUNNER_TEMP/mcp-get.json" --write-out '%{http_code}' \
            -H 'accept: text/event-stream' http://127.0.0.1:8787/mcp)
          test "$status" = "405"
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.jsonrpc!=="2.0"||x.id!==null||!x.error?.message.includes("Use POST"))process.exit(1)' "$RUNNER_TEMP/mcp-get.json"
          npm run smoke:mcp > "$RUNNER_TEMP/mcp-post-smoke.json"

      - name: Commit only the source patch and regression test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/clover-context-gateway/node_modules
          rm -f .github/workflows/apply-clover-mcp-serverless-post-only.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short | tee "$RUNNER_TEMP/changed-files.txt"
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "apps/clover-context-gateway/server.js apps/clover-context-gateway/test/serverless-mcp.test.js "
          git commit -m 'Make Clover MCP transport serverless-safe'
          git push origin "HEAD:platform/clover-context-gateway-v0.2.1-serverless-post-only-20260817"

      - name: Upload patch validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-mcp-serverless-post-only-${{ github.sha }}
          path: |
            ${{ runner.temp }}/root.json
            ${{ runner.temp }}/mcp-get.json
            ${{ runner.temp }}/mcp-post-smoke.json
            ${{ runner.temp }}/clover-post-only.log
            ${{ runner.temp }}/changed-files.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
