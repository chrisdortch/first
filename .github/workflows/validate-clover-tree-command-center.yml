            /-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----/u,
            /\bgh[oprsu]_[A-Za-z0-9]{20,}\b/u,
            /\bgithub_pat_[A-Za-z0-9_]{20,}\b/u,
            /\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b/u,
            /\/Users\/[^/\s"']+/u
