  browser:
    name: Tree browser and accessibility
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOVER_TREE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CLOVER_TREE_EXACT_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CLOVER_TREE_LOCAL_SOURCE_CLOSURE_CONTEXT: ${{ github.event_name == 'pull_request' && 'exact-pr-head' || 'disabled-non-pr' }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_WORKSPACE:-}"
          [[ "$GITHUB_WORKSPACE" = /* ]]
          test -d "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE"
          repository_root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          test "$repository_root" = "$GITHUB_WORKSPACE"
          test "$(git -C "$repository_root" rev-parse --show-toplevel)" = "$repository_root"
          test "$(git -C "$repository_root" rev-parse HEAD)" = "$CLOVER_TREE_HEAD"

