          };
          if (gitLine(['rev-parse', '--show-toplevel'], 'exact-head repository discovery') !== repositoryRoot) throw new Error('exact-head repository discovery mismatch');
          const head = gitLine(['rev-parse', 'HEAD'], 'exact-head commit');
          const tree = gitLine(['rev-parse', 'HEAD^{tree}'], 'exact-head tree');
          const roots = ['apps/clover-launch-studio', 'portfolio/core/tree-program'];
          const rawFiles = gitBytes(['ls-files', '-z', '--', ...roots]);
          if (rawFiles.length === 0 || rawFiles[rawFiles.length - 1] !== 0x00) throw new Error('exact-head source inventory is empty or not NUL terminated');
          const files = rawFiles.subarray(0, rawFiles.length - 1).toString('utf8').split('\0');
          if (files.some((file) => !file || /[\0\r\n]/u.test(file))) throw new Error('exact-head source inventory is malformed');
