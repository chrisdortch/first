          let duplicateRejected = false;
          try { fatalJson(Buffer.from('{"identity":1,"identity":2}\n'), 'synthetic duplicate-key receipt'); } catch { duplicateRejected = true; }
          requireCondition(duplicateRejected, 'duplicate-key receipt mutation was accepted');
          let utf8Rejected = false;
          try { fatalJson(Buffer.from([0xff, 0xfe]), 'synthetic invalid-UTF8 receipt'); } catch { utf8Rejected = true; }
          requireCondition(utf8Rejected, 'invalid-UTF8 receipt mutation was accepted');
          const receiptFsMutationRoot = path.join(process.env.RUNNER_TEMP, 'clover-local-receipt-fs-negative');
          requireCondition(!fs.existsSync(receiptFsMutationRoot), 'receipt filesystem mutation root must be fresh');
          fs.mkdirSync(receiptFsMutationRoot, { mode: 0o755 });
