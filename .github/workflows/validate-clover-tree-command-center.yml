          };
          const oneEventMutations = [
            ['raw-extra', (candidate) => { candidate.rawEvents[0].extra = true; }],
            ['raw-missing', (candidate) => { delete candidate.rawEvents[0].finding; }],
            ['raw-linkage', (candidate) => { candidate.rawEvents[0].requestIdentity = 99; }],
            ['raw-generation', (candidate) => { candidate.rawEvents[0].generation += 1; }],
            ['completion-extra', (candidate) => { candidate.independentCompletionEvidence[0].extra = true; }],
            ['completion-missing', (candidate) => { delete candidate.independentCompletionEvidence[0].serverSha256; }],
            ['completion-linkage', (candidate) => { candidate.independentCompletionEvidence[0].eventId = '3'.repeat(64); }],
            ['completion-bytes', (candidate) => { candidate.independentCompletionEvidence[0].clientByteCount -= 1; }],
            ['completion-digest', (candidate) => { candidate.independentCompletionEvidence[0].clientSha256 = '4'.repeat(64); }],
            ['attestation-digest', (candidate) => { candidate.independentCompletionEvidence[0].attestationClientSha256 = '4'.repeat(64); }],
            ['adjudication-extra', (candidate) => { candidate.adjudications[0].extra = true; }],
            ['adjudication-missing', (candidate) => { delete candidate.adjudications[0].reason; }],
            ['adjudication-reason', (candidate) => { candidate.adjudications[0].reason = 'substituted'; }],
            ['final-generation-backward', (candidate) => { candidate.closure.generation = syntheticGeneration - 1; }],
            ['artifact-proof-missing', (candidate) => { candidate.closure.reportingArtifactExactGeneration = null; }],
            ['artifact-proof-extra-key', (candidate) => {
              const proof = candidate.closure.reportingArtifactExactGeneration;
              proof.unreviewed = true; resealReceiptGenerationProof(proof);
            }],
            ['artifact-proof-path-order', (candidate) => {
              const proof = candidate.closure.reportingArtifactExactGeneration;
              proof.requests.reverse(); resealReceiptGenerationProof(proof);
            }],
            ['artifact-tree-status', (candidate) => {
              const proof = candidate.closure.reportingArtifactExactGeneration;
              proof.requests[0].request.status = 500; resealReceiptGenerationProof(proof);
            }],
            ['artifact-provenance-terminal', (candidate) => {
              const proof = candidate.closure.reportingArtifactExactGeneration;
              proof.requests[1].request.terminal = 'finished'; proof.requests[1].request.failure = null;
