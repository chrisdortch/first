          assertNoSyntheticPrivacyFixtureBody(manifestBytes, 'browser artifact manifest');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'clover-tree-browser-artifact-manifest.json'), manifestBytes, { mode: 0o644 });
