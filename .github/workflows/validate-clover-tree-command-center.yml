          }
          for (const [mutationName, mutate] of oneEventMutations) {
            rejectReceiptMutation(syntheticOneEvent, syntheticState, `synthetic-one-event:${mutationName}`, mutate);
          }
          for (const { project, document } of documents) {
            const gateReceiptEntry = localReceipts.find((entry) => entry.project === project
              && entry.title === 'all views and material states close Axe findings with visible keyboard entry and exit');
            requireCondition(gateReceiptEntry !== undefined, `${project} Gate local receipt missing`);
            const sidecar = scanAttemptSidecars.get(project)?.sidecar;
            requireCondition(sidecar !== undefined, `${project} Gate sidecar missing for receipt linkage`);
            const finalFence = document.scans.at(-1)?.gateAttemptProof?.afterFence;
            requireCondition(finalFence !== undefined
              && gateReceiptEntry.receipt.closure.generation === finalFence.generation.id,
            `${project} Gate receipt final closure does not bind the final accepted fence`);
            const bindReceiptGenerationProofToFinalFence = (proof, proofLabel) => {
              requireCondition(proof.id >= finalFence.trace.currentDocumentStartGeneration,
                `${project} ${proofLabel} precedes the anchored current-document suffix`);
              proof.requests.forEach((entry) => {
