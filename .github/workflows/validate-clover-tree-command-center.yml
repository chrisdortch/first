            }
            gateReceiptEntry.receipt.closure.postArtifactExactGenerations.forEach((proof, index) =>
              bindReceiptGenerationProofToFinalFence(proof, `post-artifact generation proof ${index}`));
            const fences = [
              ...document.scans.flatMap(({ gateAttemptProof }) => [gateAttemptProof.beforeFence, gateAttemptProof.afterFence]),
              ...sidecar.preAxeStartFenceCollisions.map(({ afterFence }) => afterFence),
              ...sidecar.rejectedAttempts.flatMap(({ beforeFence, afterFence }) => [beforeFence, afterFence])
            ];
            const artifacts = fences.flatMap(({ localReportingArtifacts }) => localReportingArtifacts);
            const uniqueArtifacts = [...new Map(artifacts.map((artifact) => [artifact.canonicalSha256, artifact])).values()];
            requireCondition(uniqueArtifacts.length <= 1, `${project} Gate fences disagree on the local reporting artifact`);
            const receiptHasOneEvent = gateReceiptEntry.receipt.rawEvents.length === 1;
            requireCondition(receiptHasOneEvent === (uniqueArtifacts.length === 1), `${project} Gate receipt/fence artifact iff mismatch`);
            if (uniqueArtifacts.length === 1) {
