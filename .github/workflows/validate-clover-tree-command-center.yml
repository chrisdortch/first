          requireCondition(symlinkRejected, 'symlinked receipt mutation was accepted');
          const wrongMode = path.join(receiptFsMutationRoot, 'wrong-mode.json');
          fs.writeFileSync(wrongMode, localReceipts[0].bytes, { mode: 0o600, flag: 'wx' });
          let modeRejected = false;
          try { readExactReceiptFile(wrongMode, 'mode mutation'); } catch { modeRejected = true; }
          requireCondition(modeRejected, 'wrong-mode receipt mutation was accepted');
          let unsafePathRejected = false;
