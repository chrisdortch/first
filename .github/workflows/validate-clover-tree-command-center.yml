              entry.client.documentRequestId = entry.request.sequence; entry.client.requestIdentity = entry.request.sequence;
              entry.delivery.requestIdentity = entry.request.sequence; resealReceiptGenerationProof(proof);
            }],
            ['post-artifact-client-application-generation', (candidate) => {
              const proof = candidate.closure.postArtifactExactGenerations[0];
              proof.requests[0].request.clientApplicationGeneration = proof.id + 1; resealReceiptGenerationProof(proof);
            }],
            ['post-artifact-client-method', (candidate) => {
              const proof = candidate.closure.postArtifactExactGenerations[0];
              proof.requests[0].client.method = 'POST'; resealReceiptGenerationProof(proof);
            }],
            ['post-artifact-client-url', (candidate) => {
              const proof = candidate.closure.postArtifactExactGenerations[0];
              proof.requests[0].client.url = 'http://127.0.0.1:41731/api/provenance'; resealReceiptGenerationProof(proof);
