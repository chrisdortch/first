name: Validate Clover Tree Command Center

on:
  pull_request:
    paths:
      - 'apps/clover-launch-studio/**'
      - 'portfolio/core/tree-program/**'
      - '.github/workflows/validate-clover-tree-command-center.yml'
  push:
    branches:
      - main
      - 'feature/clover-tree-command-center-launch-studio-*'
    paths:
      - 'apps/clover-launch-studio/**'
      - 'portfolio/core/tree-program/**'
      - '.github/workflows/validate-clover-tree-command-center.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tree Command Center (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    env:
      CLOVER_TREE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CLOVER_TREE_EXACT_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CLOVER_TREE_LOCAL_SOURCE_CLOSURE_CONTEXT: ${{ github.event_name == 'pull_request' && 'exact-pr-head' || 'disabled-non-pr' }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_WORKSPACE:-}"
          [[ "$GITHUB_WORKSPACE" = /* ]]
          test -d "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE"
          repository_root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          test "$repository_root" = "$GITHUB_WORKSPACE"
          test "$(git -C "$repository_root" rev-parse --show-toplevel)" = "$repository_root"
          [[ "$CLOVER_TREE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$repository_root" rev-parse HEAD)" = "$CLOVER_TREE_HEAD"
          test "$(git -C "$repository_root" rev-parse --is-shallow-repository)" = "false"
          git -C "$repository_root" diff --check

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/clover-launch-studio/package-lock.json

      - name: Install exact locked dependencies
        working-directory: apps/clover-launch-studio
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require zero high-severity dependency findings
        working-directory: apps/clover-launch-studio
        run: npm audit --audit-level=high

      - name: Record clean exact-source build provenance
        working-directory: apps/clover-launch-studio
        run: |
          npm run --silent attest:source > "$RUNNER_TEMP/clover-tree-source-provenance.json"
          npm run --silent attest:source-manifest > "$RUNNER_TEMP/clover-tree-source-manifest.json"
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/clover-tree-source-provenance.json","utf8"));if(p.commit!==process.env.CLOVER_TREE_HEAD||p.cleanWorktree!==true||p.privateDataAccessed!==false||p.consequentialAuthorityGranted!==false)throw new Error("source provenance mismatch")'
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');
          const path = require('node:path');
          const { TextDecoder } = require('node:util');
          const p = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/clover-tree-source-provenance.json`, 'utf8'));
          const m = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/clover-tree-source-manifest.json`, 'utf8'));
          const canonical = value => JSON.stringify(Array.isArray(value) ? value.map(canonicalValue) : canonicalValue(value));
          function canonicalValue(value) { return value && typeof value === 'object' && !Array.isArray(value) ? Object.fromEntries(Object.keys(value).sort().map(key => [key, canonicalValue(value[key])])) : Array.isArray(value) ? value.map(canonicalValue) : value; }
          const hash = value => crypto.createHash('sha256').update(value).digest('hex');
          const exactKeys = (value, keys) => JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort());
          const safePath = value => typeof value === 'string' && value.length > 0 && value === value.normalize('NFC') && !value.startsWith('/') && !value.startsWith(':') && !value.includes('\\') && !/[\0\t\r\n]/u.test(value) && !value.split('/').includes('..');
          const fatalUtf8 = new TextDecoder('utf-8', { fatal: true });
          const identityGitEnvironmentKeys = new Set([
            'GIT_DIR', 'GIT_WORK_TREE', 'GIT_INDEX_FILE', 'GIT_COMMON_DIR', 'GIT_OBJECT_DIRECTORY',
            'GIT_ALTERNATE_OBJECT_DIRECTORIES', 'GIT_CEILING_DIRECTORIES', 'GIT_PREFIX'
          ]);
          if (Object.keys(process.env).some((key) => (identityGitEnvironmentKeys.has(key) || key === 'GIT_CONFIG_COUNT' || /^GIT_CONFIG_(?:KEY|VALUE)_/u.test(key)) && process.env[key])) {
            throw new Error('source verifier received an identity-substituting Git environment');
          }
          const workspace = process.env.GITHUB_WORKSPACE;
          if (typeof workspace !== 'string' || workspace.length === 0 || workspace !== workspace.normalize('NFC')
              || !path.isAbsolute(workspace) || path.normalize(workspace) !== workspace || path.resolve(workspace) !== workspace) {
            throw new Error('source verifier repository root input is invalid');
          }
          const workspaceStat = fs.lstatSync(workspace);
          if (!workspaceStat.isDirectory() || workspaceStat.isSymbolicLink()) throw new Error('source verifier repository root is not one real directory');
          const repositoryRoot = fs.realpathSync.native(workspace);
          if (repositoryRoot !== workspace) throw new Error('source verifier repository root is symlinked or substituted');
          const gitEnvironment = { ...process.env, LC_ALL: 'C', LANG: 'C', GIT_OPTIONAL_LOCKS: '0' };
          const gitAtBytes = (directory, args) => cp.execFileSync('git', ['-C', directory, ...args], {
            encoding: null, env: gitEnvironment, maxBuffer: 64 * 1024 * 1024
          });
          const gitAtLine = (directory, args, label) => {
            const raw = gitAtBytes(directory, args);
            if (raw.length < 2 || raw[raw.length - 1] !== 0x0a || raw.subarray(0, raw.length - 1).includes(0x0a)
                || raw.includes(0x00) || raw.includes(0x0d)) throw new Error(`${label} did not return one canonical line`);
            let value;
            try { value = fatalUtf8.decode(raw.subarray(0, raw.length - 1)); } catch { throw new Error(`${label} returned invalid UTF-8`); }
            return value;
          };
          const gitRootBytes = (args) => gitAtBytes(repositoryRoot, args);
          const gitRootLine = (args, label) => gitAtLine(repositoryRoot, args, label);
          const discoveredRoot = gitRootLine(['rev-parse', '--show-toplevel'], 'repository discovery');
          if (!path.isAbsolute(discoveredRoot) || fs.realpathSync.native(discoveredRoot) !== repositoryRoot || discoveredRoot !== repositoryRoot
              || gitRootLine(['rev-parse', '--is-inside-work-tree'], 'repository worktree status') !== 'true'
              || gitRootLine(['rev-parse', '--is-bare-repository'], 'repository bare status') !== 'false') {
            throw new Error('source verifier repository discovery mismatch');
          }
          if (gitRootBytes(['status', '--porcelain=v1', '-z', '--untracked-files=all']).length !== 0) throw new Error('source verifier worktree is dirty');
          const resolveCommit = (revision) => {
            if (!/^[0-9a-f]{40}$/u.test(revision)) throw new Error('source verifier revision is malformed');
            const resolved = gitRootLine(['rev-parse', '--verify', `${revision}^{commit}`], 'source revision');
            if (resolved !== revision) throw new Error('source verifier revision was substituted');
            return resolved;
          };
          const readTreeRecord = (revision, entryPath, allowMissing = false) => {
            const raw = gitRootBytes(['ls-tree', '-z', '--full-tree', revision, '--', `:(top,literal)${entryPath}`]);
            if (allowMissing && raw.length === 0) return null;
            if (raw.length === 0 || raw[raw.length - 1] !== 0x00 || raw.indexOf(0x00) !== raw.length - 1) {
              throw new Error(`source tree record count mismatch: ${entryPath}`);
            }
            const record = raw.subarray(0, raw.length - 1);
            const tab = record.indexOf(0x09);
            if (tab <= 0) throw new Error(`source tree record separator mismatch: ${entryPath}`);
            const metadataBytes = record.subarray(0, tab);
            if ([...metadataBytes].some((byte) => byte > 0x7f)) throw new Error(`source tree metadata encoding mismatch: ${entryPath}`);
            const metadata = metadataBytes.toString('ascii');
            const match = /^(100644|100755) blob ([0-9a-f]{40})$/u.exec(metadata);
            if (!match) throw new Error(`source tree metadata mismatch: ${entryPath}`);
            let returnedPath;
            try { returnedPath = fatalUtf8.decode(record.subarray(tab + 1)); } catch { throw new Error(`source tree path encoding mismatch: ${entryPath}`); }
            if (returnedPath !== entryPath) throw new Error(`source tree path mismatch: ${entryPath}`);
            return { mode: match[1], type: 'blob', blob: match[2], path: returnedPath };
          };
          const readFileEvidence = (revision, record) => {
            const resolved = resolveCommit(revision);
            const tree = readTreeRecord(resolved, record.path);
            const bytes = gitRootBytes(['show', `${resolved}:${record.path}`]);
            const blob = gitRootLine(['rev-parse', '--verify', `${resolved}:${record.path}`], `source blob ${record.path}`);
            const computedBlob = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if (tree.mode !== record.mode || tree.blob !== record.blob || blob !== record.blob || computedBlob !== record.blob
                || bytes.length !== record.bytes || hash(bytes) !== record.sha256) throw new Error(`source bytes mismatch: ${record.path}`);
            return { path: record.path, mode: tree.mode, type: tree.type, blob: tree.blob, bytes: bytes.length, sha256: hash(bytes) };
          };
          if (!exactKeys(m, ['documentType','schemaVersion','sourceCommit','stackABase','entries','pathCount','pathListSha256','sourceManifestSha256','manifestSelfHash']) ||
              m.documentType !== 'clover-tree-source-manifest' || m.schemaVersion !== '0.4.0' || m.sourceCommit !== p.commit || m.stackABase !== p.stackABase ||
              m.pathCount !== 72 || m.pathCount !== p.changedPathCount || m.pathListSha256 !== '9217479f428109ec268f8e2579e6da55abb649080306966c31d5ab62edc8a6a8' ||
              m.pathListSha256 !== p.pathListSha256 || m.sourceManifestSha256 !== p.sourceManifestSha256 || !Array.isArray(m.entries) || m.entries.length !== m.pathCount) throw new Error('source manifest identity mismatch');
          const paths = m.entries.map(entry => entry.path);
          if (paths.some(path => !safePath(path)) || new Set(paths).size !== paths.length || paths.some((path, index) => index && Buffer.compare(Buffer.from(paths[index - 1]), Buffer.from(path)) >= 0) ||
              hash(`${paths.join('\n')}\n`) !== m.pathListSha256 || hash(`${canonical(m.entries)}\n`) !== m.sourceManifestSha256) throw new Error('source manifest path mismatch');
          for (const entry of m.entries) {
            const revision = entry.status === 'D' ? m.stackABase : m.sourceCommit;
            const record = entry.status === 'D' ? entry.base : entry;
            if (entry.status === 'D') {
              if (!exactKeys(entry, ['path','status','base','current']) || entry.current !== null || !record || record.path !== entry.path) throw new Error(`source deletion mismatch: ${entry.path}`);
            } else if (!exactKeys(entry, ['path','mode','blob','bytes','sha256'])) throw new Error(`source entry schema mismatch: ${entry.path}`);
            if (!exactKeys(record, ['path','mode','blob','bytes','sha256']) || record.path !== entry.path || !/^(?:100644|100755)$/u.test(record.mode) || !/^[0-9a-f]{40}$/u.test(record.blob) || !Number.isSafeInteger(record.bytes) || !/^[0-9a-f]{64}$/u.test(record.sha256)) throw new Error(`source entry invalid: ${entry.path}`);
            readFileEvidence(revision, record);
            if (entry.status === 'D' && readTreeRecord(resolveCommit(m.sourceCommit), entry.path, true) !== null) throw new Error(`source deletion is still present: ${entry.path}`);
          }
          const workflowPath = '.github/workflows/validate-clover-tree-command-center.yml';
          const workflowEntry = m.entries.find((entry) => entry.path === workflowPath);
          if (!workflowEntry || workflowEntry.status === 'D') throw new Error('source workflow entry is missing from the current manifest');
          const expectedWorkflowEvidence = readFileEvidence(m.sourceCommit, workflowEntry);
          const invocationDirectories = [
            repositoryRoot,
            path.join(repositoryRoot, 'apps/clover-launch-studio'),
            path.join(repositoryRoot, 'portfolio/core/tree-program')
          ];
          const originalDirectory = process.cwd();
          try {
            for (const directory of invocationDirectories) {
              const stat = fs.lstatSync(directory);
              if (!stat.isDirectory() || stat.isSymbolicLink() || fs.realpathSync.native(directory) !== directory
                  || gitAtLine(directory, ['rev-parse', '--show-toplevel'], 'nested repository discovery') !== repositoryRoot) {
                throw new Error('source verifier nested invocation directory mismatch');
              }
              process.chdir(directory);
              const observed = readFileEvidence(m.sourceCommit, workflowEntry);
              if (canonical(observed) !== canonical(expectedWorkflowEvidence)) throw new Error('source workflow identity changed by invocation directory');
            }
          } finally {
            process.chdir(originalDirectory);
          }
          if (gitRootBytes(['status', '--porcelain=v1', '-z', '--untracked-files=all']).length !== 0) throw new Error('source verifier changed the worktree');
          const { manifestSelfHash, ...body } = m;
          if (hash(`${canonical(body)}\n`) !== manifestSelfHash) throw new Error('source manifest self-hash mismatch');
          NODE

      - name: Validate Tree Program
        run: node --test portfolio/core/test/tree-program.test.mjs

      - name: Validate Launch Studio application
        working-directory: apps/clover-launch-studio
        run: npm run validate

      - name: Build and seal exact final deployment input
        if: matrix.node-version == '24'
        env:
          VERCEL_ORG_ID: team_kx19aCrSTnej6wpz0fLgmYDY
          VERCEL_PROJECT_ID: prj_1lfjYV2FehNxEyW9hGqNwAe7a8xZ
          VERCEL_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          test -n "${GITHUB_WORKSPACE:-}"
          test -n "${RUNNER_TEMP:-}"
          [[ "$GITHUB_WORKSPACE" = /* ]]
          [[ "$RUNNER_TEMP" = /* ]]
          test -d "$GITHUB_WORKSPACE"
          test -d "$RUNNER_TEMP"
          test ! -L "$GITHUB_WORKSPACE"
          test ! -L "$RUNNER_TEMP"
          repository_root="$(realpath -e -- "$GITHUB_WORKSPACE")"
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          test "$repository_root" = "$GITHUB_WORKSPACE"
          test "$runner_temp" = "$RUNNER_TEMP"
          test "$(git -C "$repository_root" rev-parse --show-toplevel)" = "$repository_root"
          case "$runner_temp/" in
            "$repository_root/"*) echo "RUNNER_TEMP must remain outside the repository" >&2; exit 1 ;;
          esac
          cd "$repository_root"
          test "$(pwd -P)" = "$repository_root"
          test "$(git -C "$repository_root" status --porcelain=v1 --untracked-files=all)" = ""
          test -z "${VERCEL_TOKEN:-}"
          export NEXT_DEPLOYMENT_ID="clover-${CLOVER_TREE_HEAD:0:24}"
          [[ "$NEXT_DEPLOYMENT_ID" =~ ^clover-[0-9a-f]{24}$ ]]
          repository_vercel="$repository_root/.vercel"
          repository_output="$repository_vercel/output"
          application_vercel="$repository_root/apps/clover-launch-studio/.vercel"
          application_output="$application_vercel/output"
          export VERCEL_CONFIG_DIR="$runner_temp/clover-vercel-cli-config"
          build_output="$runner_temp/clover-build-output"
          attestation_evidence="$runner_temp/clover-attestation-evidence"
          frozen_workspace="$runner_temp/clover-frozen-workspace"
          deployment_input_digests="$runner_temp/clover-deployment-input-digests.json"
          deployment_input_verification="$runner_temp/clover-deployment-input-verification.json"
          source_provenance="$runner_temp/clover-tree-source-provenance.json"
          cleanup_build_residues() {
            rm -rf -- "$repository_vercel" "$application_vercel" "$VERCEL_CONFIG_DIR"
          }
          for stale_path in \
            "$repository_vercel" \
            "$application_vercel" \
            "$VERCEL_CONFIG_DIR" \
            "$build_output" \
            "$attestation_evidence" \
            "$frozen_workspace" \
            "$deployment_input_digests" \
            "$deployment_input_verification"; do
            if [[ -e "$stale_path" || -L "$stale_path" ]]; then
              echo "stale deployment-input path exists: $stale_path" >&2
              exit 1
            fi
          done
          CLOVER_REPOSITORY_ROOT="$repository_root" node <<'NODE'
          const cp = require('node:child_process');
          const rawInventory = cp.execFileSync('find', [
            '-P', process.env.CLOVER_REPOSITORY_ROOT, '-name', 'output', '-path', '*/.vercel/output', '-prune', '-print0'
          ], { encoding: null, maxBuffer: 16 * 1024 * 1024 });
          if (rawInventory.length !== 0) {
            throw new Error('Stale repository Build Output exists before the exact build');
          }
          NODE
          trap cleanup_build_residues EXIT
          mkdir -p -- "$VERCEL_CONFIG_DIR"
          mkdir -p -- "$repository_vercel"
          node "$repository_root/apps/clover-launch-studio/scripts/clover-deployment-attestation.mjs" project-settings --repository-root "$repository_root" > "$repository_vercel/project.json"
          test "$(find "$repository_vercel" -mindepth 1 -maxdepth 1 -print)" = "$repository_vercel/project.json"
          expected_project_settings_sha="$(node -e 'const fs=require("node:fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).buildProjectSettingsSha256)' "$source_provenance")"
          actual_project_settings_sha="$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$repository_vercel/project.json")"
          test "$actual_project_settings_sha" = "$expected_project_settings_sha"
          npx --yes vercel@59.6.2 build --yes
          actual_project_settings_sha="$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$repository_vercel/project.json")"
          test "$actual_project_settings_sha" = "$expected_project_settings_sha"
          test -z "$(find "$VERCEL_CONFIG_DIR" -mindepth 1 -print -quit)"
          CLOVER_REPOSITORY_ROOT="$repository_root" CLOVER_REPOSITORY_OUTPUT="$repository_output" CLOVER_APPLICATION_OUTPUT="$application_output" node <<'NODE'
          const cp = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const { TextDecoder } = require('node:util');
          const repositoryRoot = process.env.CLOVER_REPOSITORY_ROOT;
          const repositoryOutput = process.env.CLOVER_REPOSITORY_OUTPUT;
          const applicationOutput = process.env.CLOVER_APPLICATION_OUTPUT;
          if (repositoryOutput !== path.join(repositoryRoot, '.vercel', 'output')
              || applicationOutput !== path.join(repositoryRoot, 'apps', 'clover-launch-studio', '.vercel', 'output')) {
            throw new Error('Build Output paths are not the exact closed locations');
          }
          const stat = fs.lstatSync(repositoryOutput);
          if (!stat.isDirectory() || stat.isSymbolicLink() || fs.realpathSync.native(repositoryOutput) !== repositoryOutput) {
            throw new Error('Repository-root Build Output is not one canonical real directory');
          }
          const relativeOutput = path.relative(repositoryRoot, repositoryOutput);
          if (relativeOutput !== '.vercel/output' || path.isAbsolute(relativeOutput) || relativeOutput.startsWith('..')) {
            throw new Error('Repository-root Build Output escaped canonical containment');
          }
          try {
            fs.lstatSync(applicationOutput);
            throw new Error('Application-local Build Output must remain absent');
          } catch (error) {
            if (!(error && error.code === 'ENOENT')) throw error;
          }
          const rawInventory = cp.execFileSync('find', [
            '-P', repositoryRoot, '-name', 'output', '-path', '*/.vercel/output', '-prune', '-print0'
          ], { encoding: null, maxBuffer: 16 * 1024 * 1024 });
          if (rawInventory.length === 0 || rawInventory[rawInventory.length - 1] !== 0) {
            throw new Error('Build Output inventory is empty or not NUL terminated');
          }
          const inventory = new TextDecoder('utf-8', { fatal: true })
            .decode(rawInventory.subarray(0, -1)).split('\0');
          if (inventory.length !== 1 || inventory[0] !== repositoryOutput) {
            throw new Error(`Expected one exact repository-root Build Output, received ${JSON.stringify(inventory)}`);
          }
          NODE
          mv -- "$repository_output" "$build_output"
          test -d "$build_output"
          test ! -L "$build_output"
          test "$(realpath -e -- "$build_output")" = "$build_output"
          if [[ -e "$repository_output" || -L "$repository_output" ]]; then
            echo "repository-root Build Output remained after the exact move" >&2
            exit 1
          fi
          cleanup_build_residues
          for residue in "$repository_vercel" "$application_vercel" "$VERCEL_CONFIG_DIR"; do
            if [[ -e "$residue" || -L "$residue" ]]; then
              echo "bounded Vercel build residue remained: $residue" >&2
              exit 1
            fi
          done
          CLOVER_REPOSITORY_ROOT="$repository_root" node <<'NODE'
          const cp = require('node:child_process');
          const rawInventory = cp.execFileSync('find', [
            '-P', process.env.CLOVER_REPOSITORY_ROOT, '-name', 'output', '-path', '*/.vercel/output', '-prune', '-print0'
          ], { encoding: null, maxBuffer: 16 * 1024 * 1024 });
          if (rawInventory.length !== 0) {
            throw new Error('Repository Build Output residue remained after cleanup');
          }
          NODE
          test "$(git -C "$repository_root" status --porcelain=v1 --untracked-files=all)" = ""
          trap - EXIT
          node "$repository_root/apps/clover-launch-studio/scripts/clover-deployment-attestation.mjs" output --repository-root "$repository_root" --output "$build_output" --evidence "$attestation_evidence" --frozen-output "$frozen_workspace" > "$deployment_input_digests"
          node "$repository_root/apps/clover-launch-studio/scripts/clover-deployment-attestation.mjs" verify --repository-root "$repository_root" --output "$frozen_workspace/.vercel/output" --evidence "$attestation_evidence" > "$deployment_input_verification"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const root = process.env.RUNNER_TEMP;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const source = read('clover-tree-source-provenance.json');
          const manifest = read('clover-tree-source-manifest.json');
          const created = read('clover-deployment-input-digests.json');
          const verified = read('clover-deployment-input-verification.json');
          const cliInvocation = created.cliInvocation;
          const exactCliKeys = [
            'canonicalCliExecutable', 'installRoot', 'launcherKind', 'packageIntegrityVerified',
            'packageRoot', 'packageVersion', 'rawCliExecutable'
          ].sort();
          if (!cliInvocation || typeof cliInvocation !== 'object' || Array.isArray(cliInvocation)
              || JSON.stringify(Object.keys(cliInvocation).sort()) !== JSON.stringify(exactCliKeys)
              || !['direct', 'npm-bin-vc', 'npm-bin-vercel'].includes(cliInvocation.launcherKind)
              || cliInvocation.installRoot !== '/var/task/.vercel-cli'
              || cliInvocation.packageRoot !== '/var/task/.vercel-cli/node_modules/vercel'
              || cliInvocation.canonicalCliExecutable !== '/var/task/.vercel-cli/node_modules/vercel/dist/vc.js'
              || cliInvocation.rawCliExecutable !== (cliInvocation.launcherKind === 'direct'
                ? cliInvocation.canonicalCliExecutable
                : `/var/task/.vercel-cli/node_modules/.bin/${cliInvocation.launcherKind === 'npm-bin-vc' ? 'vc' : 'vercel'}`)
              || cliInvocation.packageVersion !== '59.6.2' || cliInvocation.packageIntegrityVerified !== true) {
            throw new Error('sanitized Vercel CLI invocation identity mismatch');
          }
          const evidence = path.join(root, 'clover-attestation-evidence');
          const documents = {
            payloadManifest: 'clover-build-output-manifest.json',
            deploymentInputManifest: 'clover-deployment-input-manifest.json',
            archiveManifest: 'clover-final-archive-manifest.json',
            archive: 'clover-final-deployment-input.tar'
          };
          for (const file of Object.values(documents)) {
            const stat = fs.lstatSync(path.join(evidence, file));
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error(`unsafe evidence file: ${file}`);
          }
          const attestationPath = path.join(root, 'clover-frozen-workspace/.vercel/output/static/__clover/deployment-attestation.json');
