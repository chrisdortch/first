        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/clover-launch-studio/package-lock.json

      - name: Install exact locked dependencies
        working-directory: apps/clover-launch-studio
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium browser runtime
        working-directory: apps/clover-launch-studio
        run: npx playwright install --with-deps chromium

      - name: Verify clean source provenance before browser build
        working-directory: apps/clover-launch-studio
        run: |
          npm run --silent attest:source > "$RUNNER_TEMP/clover-tree-browser-source-provenance.json"
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/clover-tree-browser-source-provenance.json","utf8"));if(p.commit!==process.env.CLOVER_TREE_HEAD||p.cleanWorktree!==true)throw new Error("browser source provenance mismatch")'

      - name: Run desktop, mobile and accessibility checks
