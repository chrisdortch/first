          syntheticArtifactProvenance.client.serverSha256 = syntheticCompletion.serverSha256;
          syntheticArtifactProvenance.client.clientSha256 = syntheticCompletion.clientSha256;
          syntheticArtifactProvenance.delivery.byteCount = syntheticCompletion.serverByteCount;
          syntheticArtifactProvenance.delivery.bodyUtf8ByteCount = syntheticCompletion.serverByteCount;
          syntheticArtifactProvenance.delivery.bodySha256 = syntheticCompletion.serverSha256;
          const syntheticArtifactAttestation = syntheticArtifactProof.requests[2];
          syntheticArtifactAttestation.request.fixtureBodySha256 = syntheticCompletion.attestationServerSha256;
          syntheticArtifactAttestation.client.serverSha256 = syntheticCompletion.attestationServerSha256;
          syntheticArtifactAttestation.client.clientSha256 = syntheticCompletion.attestationClientSha256;
          syntheticArtifactAttestation.delivery.bodySha256 = syntheticCompletion.attestationServerSha256;
