            }],
            ['post-artifact-byte-count-not-positive', (candidate) => {
              const proof = candidate.closure.postArtifactExactGenerations[0]; const entry = proof.requests[0];
              entry.client.serverByteCount = 0; entry.client.clientByteCount = 0;
              entry.delivery.byteCount = 0; entry.delivery.bodyUtf8ByteCount = 0;
              resealReceiptGenerationProof(proof);
            }],
            ['reporting-artifact-timestamp', (candidate) => { candidate.closure.reportingArtifactRequestObservedAt = '2026-08-29T17:00:04.000Z'; }],
            ['final-timestamp-stale', (candidate) => {
              candidate.closure.requestObservedAt = new Date(Date.parse(syntheticReportingRequestObservedAt) - 1000).toISOString();
              candidate.closure.githubObservedAt = new Date(Date.parse(syntheticReportingGithubObservedAt) - 1000).toISOString();
            }],
            ['second-event', (candidate) => {
              candidate.rawEvents = [syntheticRaw, syntheticRaw];
              candidate.independentCompletionEvidence = [syntheticCompletion, syntheticCompletion];
