                exactJson(finalFence.client.records.find((record) => record.documentRequestId === sequence), entry.client,
                  `${project} ${proofLabel} browser request ${sequence}`);
                exactJson(finalFence.trace.deliveries.find((delivery) => delivery.requestIdentity === sequence), entry.delivery,
                  `${project} ${proofLabel} server delivery ${sequence}`);
