name: Materialize Clover Gateway lockfile

on:
  push:
    branches:
      - 'platform/clover-context-gateway-v0.1.1-deploy-20260817'
    paths:
      - '.github/workflows/materialize-clover-gateway-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: platform/clover-context-gateway-v0.1.1-deploy-20260817
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate exact lockfile without running package scripts
        working-directory: apps/clover-context-gateway
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to isolated candidate branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/clover-context-gateway/package-lock.json && git ls-files --error-unmatch apps/clover-context-gateway/package-lock.json >/dev/null 2>&1; then
            echo 'Lockfile already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/clover-context-gateway/package-lock.json
          git commit -m 'Lock Clover Context Gateway dependencies [skip ci]'
          git push origin HEAD:platform/clover-context-gateway-v0.1.1-deploy-20260817
