name: Clover reusable preview validation v1.2 candidate

on:
  workflow_call:
    inputs:
      enrollment_path:
        description: Enrollment path inside the exact protocol checkout
        required: true
        type: string
      policy_path:
        description: Tracked project policy path
        required: false
        default: .clover/project-policy.json
        type: string

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: '1'
      CLOVER_BUILD_MODE: preview-only
      CLOVER_CANDIDATE_ROOT: ${{ github.workspace }}/_clover_candidate
      CLOVER_PROTOCOL_CHECKOUT: ${{ github.workspace }}/_clover_protocol
      CLOVER_PROTOCOL_ROOT: ${{ github.workspace }}/_clover_protocol/standards/clover-build-protocol/runtime/v1.2.0
      CLOVER_SCHEMA_ROOT: ${{ github.workspace }}/_clover_protocol/standards/clover-build-protocol/schemas/v1.2.0
      CLOVER_POLICY_PATH: ${{ inputs.policy_path }}
      CLOVER_ENROLLMENT_PATH: ${{ inputs.enrollment_path }}
      CLOVER_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: _clover_candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact Clover protocol commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _clover_protocol
          persist-credentials: false

      - name: Verify exact source checkouts
        env:
          CLOVER_PROTOCOL_REPOSITORY: ${{ job.workflow_repository }}
          CLOVER_PROTOCOL_REF: ${{ job.workflow_sha }}
          CLOVER_PROTOCOL_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        shell: bash
        run: |
          test "$(git -C "$CLOVER_CANDIDATE_ROOT" rev-parse HEAD)" = "$CLOVER_CANDIDATE_SHA"
          test "$(git -C "$CLOVER_PROTOCOL_CHECKOUT" rev-parse HEAD)" = "$CLOVER_PROTOCOL_REF"
          test "${#CLOVER_PROTOCOL_REF}" = 40
          test "$CLOVER_PROTOCOL_REPOSITORY" = chrisdortch/first
          test "$CLOVER_PROTOCOL_WORKFLOW_PATH" = .github/workflows/clover-preview-v1.2.yml

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Initialize isolated evidence path
        env:
          CLOVER_EVIDENCE_ROOT: ${{ runner.temp }}/clover-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$CLOVER_EVIDENCE_ROOT"
          echo "CLOVER_ARTIFACT_DIR=$CLOVER_EVIDENCE_ROOT" >> "$GITHUB_ENV"

      - name: Install pinned protocol validation and browser tooling
        id: tooling
        continue-on-error: true
        run: npm install --prefix "$CLOVER_PROTOCOL_CHECKOUT" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund ajv@8.17.1 @playwright/test@1.62.1

      - name: Validate enrolled identity and policy schemas
        id: schemas
        if: steps.tooling.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        run: |
          node "$CLOVER_PROTOCOL_ROOT/validate-json.mjs" "$CLOVER_SCHEMA_ROOT/enrollment.schema.json" "$CLOVER_PROTOCOL_CHECKOUT/$CLOVER_ENROLLMENT_PATH" "$CLOVER_ARTIFACT_DIR/enrollment-schema.json"
          node "$CLOVER_PROTOCOL_ROOT/validate-json.mjs" "$CLOVER_SCHEMA_ROOT/project-policy.schema.json" "$CLOVER_POLICY_PATH" "$CLOVER_ARTIFACT_DIR/policy-schema.json"

      - name: Verify immutable enrollment and candidate boundaries
        id: boundary
        if: steps.schemas.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        env:
          CLOVER_PROTOCOL_REPOSITORY: ${{ job.workflow_repository }}
          CLOVER_PROTOCOL_REF: ${{ job.workflow_sha }}
          CLOVER_PROTOCOL_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        run: node "$CLOVER_PROTOCOL_ROOT/verify-boundaries.mjs" "$CLOVER_POLICY_PATH" "$CLOVER_ENROLLMENT_PATH" "$CLOVER_ARTIFACT_DIR/boundary.json"

      - name: Capture source state before project commands
        id: pre_state
        if: steps.boundary.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        run: node "$CLOVER_PROTOCOL_ROOT/snapshot-state.mjs" "$CLOVER_POLICY_PATH" "$CLOVER_ARTIFACT_DIR/pre-state.json"

      - name: Install project dependencies
        id: install
        if: steps.pre_state.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        env:
          CLOVER_PROTOCOL_REF: ${{ job.workflow_sha }}
        run: node "$CLOVER_PROTOCOL_ROOT/run-command.mjs" "$CLOVER_POLICY_PATH" install "$CLOVER_ARTIFACT_DIR/commands"

      - name: Restore exact protocol after project install
        id: protocol_after_install
        if: always() && steps.pre_state.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _clover_protocol
          clean: true
          persist-credentials: false

      - name: Restore pinned protocol tooling after project install
        id: tooling_after_install
        if: steps.protocol_after_install.outcome == 'success'
        continue-on-error: true
        run: npm install --prefix "$CLOVER_PROTOCOL_CHECKOUT" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund ajv@8.17.1 @playwright/test@1.62.1

      - name: Run project verification contract
        id: verify
        if: steps.install.outcome == 'success' && steps.tooling_after_install.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        env:
          CLOVER_PROTOCOL_REF: ${{ job.workflow_sha }}
        run: node "$CLOVER_PROTOCOL_ROOT/run-command.mjs" "$CLOVER_POLICY_PATH" verify "$CLOVER_ARTIFACT_DIR/commands"

      - name: Restore exact protocol after project verification
        id: protocol_after_verify
        if: always() && steps.pre_state.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _clover_protocol
          clean: true
          persist-credentials: false

      - name: Restore pinned protocol tooling after project verification
        id: tooling_after_verify
        if: steps.protocol_after_verify.outcome == 'success'
        continue-on-error: true
        run: npm install --prefix "$CLOVER_PROTOCOL_CHECKOUT" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund ajv@8.17.1 @playwright/test@1.62.1

      - name: Install pinned browser engines
        id: browsers
        if: steps.verify.outcome == 'success' && steps.tooling_after_verify.outcome == 'success'
        continue-on-error: true
        run: |
          "$CLOVER_PROTOCOL_CHECKOUT/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Run navigation-only browser audit
        id: browser
        if: steps.browsers.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        env:
          CLOVER_PROTOCOL_REF: ${{ job.workflow_sha }}
        run: node "$CLOVER_PROTOCOL_ROOT/browser-audit.mjs" "$CLOVER_POLICY_PATH" "$CLOVER_ARTIFACT_DIR/browser"

      - name: Restore exact protocol after browser execution
        id: protocol_after_browser
        if: always() && steps.pre_state.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _clover_protocol
          clean: true
          persist-credentials: false

      - name: Restore pinned schema tooling after browser execution
        id: tooling_after_browser
        if: steps.protocol_after_browser.outcome == 'success'
        continue-on-error: true
        run: npm install --prefix "$CLOVER_PROTOCOL_CHECKOUT" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund ajv@8.17.1

      - name: Verify final source state against pre-command snapshot
        id: final_state
        if: always() && steps.pre_state.outcome == 'success' && steps.protocol_after_browser.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        run: node "$CLOVER_PROTOCOL_ROOT/verify-state.mjs" "$CLOVER_POLICY_PATH" "$CLOVER_ARTIFACT_DIR/pre-state.json" "$CLOVER_ARTIFACT_DIR/final-state.json"

      - name: Assemble evidence-based build receipt
        id: receipt
        if: always() && (steps.protocol_after_browser.outcome == 'success' || steps.pre_state.outcome != 'success')
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        env:
          CLOVER_OUTCOME_SCHEMAS: ${{ steps.schemas.outcome }}
          CLOVER_OUTCOME_BOUNDARY: ${{ steps.boundary.outcome }}
          CLOVER_OUTCOME_PRE_STATE: ${{ steps.pre_state.outcome }}
          CLOVER_OUTCOME_INSTALL: ${{ steps.install.outcome }}
          CLOVER_OUTCOME_VERIFY: ${{ steps.verify.outcome }}
          CLOVER_OUTCOME_BROWSERS: ${{ steps.browsers.outcome }}
          CLOVER_OUTCOME_BROWSER: ${{ steps.browser.outcome }}
          CLOVER_OUTCOME_FINAL_STATE: ${{ steps.final_state.outcome }}
          CLOVER_EXPECTED_ENROLLMENT_SCHEMA_SHA: ${{ steps.schemas.outputs.enrollment_schema_sha256 }}
          CLOVER_EXPECTED_POLICY_SCHEMA_SHA: ${{ steps.schemas.outputs.policy_schema_sha256 }}
          CLOVER_EXPECTED_BOUNDARY_SHA: ${{ steps.boundary.outputs.boundary_sha256 }}
          CLOVER_EXPECTED_PRE_STATE_SHA: ${{ steps.pre_state.outputs.pre_state_sha256 }}
          CLOVER_EXPECTED_INSTALL_SHA: ${{ steps.install.outputs.install_sha256 }}
          CLOVER_EXPECTED_VERIFY_SHA: ${{ steps.verify.outputs.verify_sha256 }}
          CLOVER_EXPECTED_BROWSER_RECEIPT_SHA: ${{ steps.browser.outputs.browser_receipt_sha256 }}
          CLOVER_EXPECTED_FINAL_STATE_SHA: ${{ steps.final_state.outputs.final_state_sha256 }}
        run: node "$CLOVER_PROTOCOL_ROOT/assemble-receipt.mjs" "$CLOVER_POLICY_PATH" "$CLOVER_ARTIFACT_DIR"

      - name: Validate final build receipt schema
        id: receipt_schema
        if: always() && steps.receipt.outcome == 'success' && (steps.tooling_after_browser.outcome == 'success' || (steps.pre_state.outcome != 'success' && steps.tooling.outcome == 'success'))
        continue-on-error: true
        working-directory: ${{ env.CLOVER_CANDIDATE_ROOT }}
        run: node "$CLOVER_PROTOCOL_ROOT/validate-json.mjs" "$CLOVER_SCHEMA_ROOT/build-receipt.schema.json" "$CLOVER_ARTIFACT_DIR/build-receipt.json" "$CLOVER_ARTIFACT_DIR/build-receipt-schema.json"

      - name: Publish compact candidate summary
        if: always()
        shell: bash
        run: |
          if [ -f "$CLOVER_ARTIFACT_DIR/build-receipt.json" ]; then
            echo "## Clover Build Protocol 1.2 candidate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: **$(jq -r .status "$CLOVER_ARTIFACT_DIR/build-receipt.json")**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Candidate: \`$CLOVER_CANDIDATE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Release: **not authorized**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Provider-side effects: **$(jq -r .observations.externalProviderSideEffects.state "$CLOVER_ARTIFACT_DIR/build-receipt.json")**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Clover did not produce a final receipt." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clover-v1.2-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/clover-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

      - name: Enforce final candidate gate
        if: always()
        shell: bash
        run: |
          test -f "$CLOVER_ARTIFACT_DIR/build-receipt.json"
          test "$(jq -r .status "$CLOVER_ARTIFACT_DIR/build-receipt.json")" = passed
          test "${{ steps.tooling.outcome }}" = success
          test "${{ steps.schemas.outcome }}" = success
          test "${{ steps.boundary.outcome }}" = success
          test "${{ steps.pre_state.outcome }}" = success
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.protocol_after_install.outcome }}" = success
          test "${{ steps.tooling_after_install.outcome }}" = success
          test "${{ steps.verify.outcome }}" = success
          test "${{ steps.protocol_after_verify.outcome }}" = success
          test "${{ steps.tooling_after_verify.outcome }}" = success
          test "${{ steps.browsers.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
          test "${{ steps.protocol_after_browser.outcome }}" = success
          test "${{ steps.tooling_after_browser.outcome }}" = success
          test "${{ steps.receipt.outcome }}" = success
          test "${{ steps.receipt_schema.outcome }}" = success
          test "${{ steps.final_state.outcome }}" = success
