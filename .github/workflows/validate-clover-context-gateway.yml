name: Validate Clover Context Gateway

on:
  push:
    branches:
      - main
      - 'platform/clover-context-gateway*'
      - 'platform/clover-core-*'
    paths:
      - 'AGENTS.md'
      - 'AI_START_HERE.md'
      - 'CHATGPT_PROJECT_INSTRUCTIONS.md'
      - 'CLOVER_CONNECTOR_ROUTING.md'
      - 'CLOVER_CONTEXT_GATEWAY_POINTER.json'
      - 'CLOVER_HANDOFF_LEDGER.md'
      - 'CLOVER_OWNER_START.md'
      - 'CODEX_CLOVER_OPERATOR.md'
      - 'apps/clover-context-gateway/**'
      - 'portfolio/core/handoff/**'
      - 'portfolio/core/lib/publication-finalization.mjs'
      - 'portfolio/core/publication/**'
      - 'portfolio/core/scripts/verify-publication-finalization.mjs'
      - 'portfolio/core/today/**'
      - 'portfolio/context/**'
      - 'portfolio/registry/projections/core-project-index.v2.json'
      - 'portfolio/status/candidates/**'
      - 'portfolio/schemas/clover-command-packet.schema.json'
      - 'portfolio/schemas/clover-command-packet-1.2.schema.json'
      - 'portfolio/schemas/clover-refresh-receipt.schema.json'
      - 'portfolio/schemas/clover-project-context-pointer.schema.json'
      - '.github/workflows/validate-clover-context-gateway.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'AI_START_HERE.md'
      - 'CHATGPT_PROJECT_INSTRUCTIONS.md'
      - 'CLOVER_CONNECTOR_ROUTING.md'
      - 'CLOVER_CONTEXT_GATEWAY_POINTER.json'
      - 'CLOVER_HANDOFF_LEDGER.md'
      - 'CLOVER_OWNER_START.md'
      - 'CODEX_CLOVER_OPERATOR.md'
      - 'apps/clover-context-gateway/**'
      - 'portfolio/core/handoff/**'
      - 'portfolio/core/lib/publication-finalization.mjs'
      - 'portfolio/core/publication/**'
      - 'portfolio/core/scripts/verify-publication-finalization.mjs'
      - 'portfolio/core/today/**'
      - 'portfolio/context/**'
      - 'portfolio/registry/projections/core-project-index.v2.json'
      - 'portfolio/status/candidates/**'
      - 'portfolio/schemas/clover-command-packet.schema.json'
      - 'portfolio/schemas/clover-command-packet-1.2.schema.json'
      - 'portfolio/schemas/clover-refresh-receipt.schema.json'
      - 'portfolio/schemas/clover-project-context-pointer.schema.json'
      - '.github/workflows/validate-clover-context-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    env:
      CONTEXT_SOURCE_MODE: local
      CONTEXT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PUBLIC_BASE_URL: http://127.0.0.1:8787
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate HEAD
        shell: bash
        run: |
          [[ "$CONTEXT_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CONTEXT_SOURCE_COMMIT"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/clover-context-gateway/package-lock.json

      - name: Install pinned dependencies
        working-directory: apps/clover-context-gateway
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate source and deterministic tests
        working-directory: apps/clover-context-gateway
        run: npm run validate

      - name: Validate pointers, schemas, and non-authority invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/control-plane-validation.json"
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const files = [
            'CLOVER_CONTEXT_GATEWAY_POINTER.json',
            'portfolio/context/control-plane.json',
            'portfolio/context/LIVE_ADAPTER_REGISTRY.json',
            'portfolio/context/PROJECT_CONTEXT_POINTER.template.json',
            'portfolio/schemas/clover-command-packet.schema.json',
            'portfolio/schemas/clover-command-packet-1.2.schema.json',
            'portfolio/schemas/clover-refresh-receipt.schema.json',
            'portfolio/schemas/clover-project-context-pointer.schema.json'
          ];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          const pointer = JSON.parse(fs.readFileSync('CLOVER_CONTEXT_GATEWAY_POINTER.json', 'utf8'));
          const plane = JSON.parse(fs.readFileSync('portfolio/context/control-plane.json', 'utf8'));
          const legacyCommandSchemaBytes = fs.readFileSync('portfolio/schemas/clover-command-packet.schema.json');
          const legacyCommandSchema = JSON.parse(legacyCommandSchemaBytes);
          const candidateCommandSchema = JSON.parse(fs.readFileSync('portfolio/schemas/clover-command-packet-1.2.schema.json', 'utf8'));
          if (crypto.createHash('sha256').update(legacyCommandSchemaBytes).digest('hex') !== 'b22cdb1a82852bc7fe419257d1bc79c9537a5483c753b79b5ac08002c14a1a36') process.exit(1);
          if (legacyCommandSchema.properties?.schemaVersion?.const !== '1.1') process.exit(1);
          if (candidateCommandSchema.properties?.schemaVersion?.const !== '1.2') process.exit(1);
          if ((pointer.currentVersion || pointer.version) !== '0.2.0') process.exit(1);
          if (pointer.candidate?.version !== '0.3.1') process.exit(1);
          if (pointer.candidate?.status !== 'draft-unmerged-preview-verified') process.exit(1);
          if (pointer.candidate?.reviewedImplementation?.headCommit !== '2309bbc61dc8fcc7f2167c6c47db4a8b11cd8334') process.exit(1);
          if (pointer.candidate?.publicationReadback?.connectorId !== 'clover://publication/readback') process.exit(1);
          if (pointer.candidate?.publicationReadback?.indexHash !== '92bd597a10beba1a2a4324ebd9f500a6bf62c590dc07693f6c84e076ba83c062') process.exit(1);
          if (pointer.candidate?.publicationReadback?.recordHash !== '1c0e95512f90d4cc99bfcc616823d70895c8923df23c06ece7a074b72fedec3a') process.exit(1);
          if (pointer.candidate?.amendmentContainer?.status !== 'awaiting-post-commit-source-bound-readback' || pointer.candidate.amendmentContainer.commit !== null) process.exit(1);
          const packageJson = JSON.parse(fs.readFileSync('apps/clover-context-gateway/package.json', 'utf8'));
          if (packageJson.version !== '0.3.1') process.exit(1);
          if (!fs.existsSync(pointer.currentDocument)) process.exit(1);
          if (pointer.writeToolsEnabled !== false || pointer.standingProductionAuthority !== false) process.exit(1);
          if (plane.authority.writeToolsEnabled !== false || plane.authority.productionDataAccessEnabled !== false) process.exit(1);
          if (!fs.readFileSync('AGENTS.md', 'utf8').includes('Use CloverApps to')) process.exit(1);
          if (!fs.readFileSync('AI_START_HERE.md', 'utf8').includes('prepare_clover_command')) process.exit(1);
          console.log(JSON.stringify({ status: 'passed', deployedVersion: '0.2.0', preservedCandidateVersion: '0.3.0', candidateVersion: '0.3.1', node: process.version, writeToolsEnabled: false, standingProductionAuthority: false }));
          NODE

      - name: Verify publication finalization catalog
        shell: bash
        run: node portfolio/core/scripts/verify-publication-finalization.mjs > "$RUNNER_TEMP/publication-finalization-validation.json"

      - name: Smoke-test HTTP, exact target resolution, and MCP
        shell: bash
        working-directory: apps/clover-context-gateway
        run: |
          set -euo pipefail
          PORT=8787 npm start > "$RUNNER_TEMP/clover-context-gateway.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/ > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/command-center | grep 'Clover Command Center'
          curl --fail --silent 'http://127.0.0.1:8787/api/search?q=RollinD' > "$RUNNER_TEMP/search.json"
          curl --fail --silent --get --data-urlencode 'id=clover://project/rollindd' http://127.0.0.1:8787/api/fetch > "$RUNNER_TEMP/fetch.json"
          curl --fail --silent --get --data-urlencode 'id=clover://publication/readback' http://127.0.0.1:8787/api/fetch > "$RUNNER_TEMP/publication-readback.json"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --get --data-urlencode 'id=clover://publication/readback/current' http://127.0.0.1:8787/api/fetch)" = "404"
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"request":"Use CloverApps to evolve RollinD through a preview only"}' \
            http://127.0.0.1:8787/api/prepare-command > "$RUNNER_TEMP/command.json"
          node <<'NODE'
          const fs = require('node:fs');
          const readReceipt = (name) => JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, 'utf8'));
          const expectedCommit = process.env.CONTEXT_SOURCE_COMMIT;
          const health = readReceipt('health.json');
          const fetched = readReceipt('fetch.json');
          const command = readReceipt('command.json');
          const publication = readReceipt('publication-readback.json');
          if (!/^[a-f0-9]{40}$/.test(expectedCommit || '')) process.exit(1);
          if (health.version !== '0.3.1') process.exit(1);
          if (health.contextSource?.commit !== expectedCommit) process.exit(1);
          if (fetched.metadata?.commit !== expectedCommit) process.exit(1);
          if (command.packet?.canonicalContext?.sourceCommit !== expectedCommit) process.exit(1);
          if (command.packet?.schemaVersion !== '1.2') process.exit(1);
          if (command.packet?.project?.projectId !== 'rollindd') process.exit(1);
          if (command.packet?.authority?.productionDeploymentApproved !== false) process.exit(1);
          if (!command.packet?.freshness?.sourcePlan?.length) process.exit(1);
          if (command.today?.available !== true) process.exit(1);
          if (command.today?.data?.actionId !== 'CLOVER-2026-08-20-002') process.exit(1);
          if (!/^[a-f0-9]{64}$/.test(command.today?.data?.envelopeHash || '')) process.exit(1);
          if (command.today?.data?.privacy?.publicSanitizedProjection !== true) process.exit(1);
          if (command.today?.data?.privacy?.containsRawCellData !== false) process.exit(1);
          if (publication.id !== 'clover://publication/readback') process.exit(1);
          if (publication.metadata?.hashVerified !== true) process.exit(1);
          if (publication.metadata?.contentHash !== '1c0e95512f90d4cc99bfcc616823d70895c8923df23c06ece7a074b72fedec3a') process.exit(1);
          if (command.today?.publicationReadback?.available !== true) process.exit(1);
          if (command.today?.publicationReadback?.metadata?.containerSource?.commit !== expectedCommit) process.exit(1);
          if (command.today?.evidencePrecedence?.reviewedImplementationHead !== '2309bbc61dc8fcc7f2167c6c47db4a8b11cd8334') process.exit(1);
          if (command.today?.evidencePrecedence?.status !== 'verified-publication-readback-preferred') process.exit(1);
          for (const component of Object.values(command.today?.components || {})) {
            if (component?.metadata?.commit !== expectedCommit) process.exit(1);
          }
          NODE
          npm run smoke:mcp > "$RUNNER_TEMP/mcp-smoke.json"

      - name: Upload source, command-packet, and MCP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clover-context-gateway-v0.3.1-candidate-node-${{ matrix.node-version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/clover-context-gateway/package-lock.json
            ${{ runner.temp }}/control-plane-validation.json
            ${{ runner.temp }}/publication-finalization-validation.json
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/search.json
            ${{ runner.temp }}/fetch.json
            ${{ runner.temp }}/publication-readback.json
            ${{ runner.temp }}/command.json
            ${{ runner.temp }}/mcp-smoke.json
            ${{ runner.temp }}/clover-context-gateway.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
