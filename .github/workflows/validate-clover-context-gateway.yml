name: Validate Clover Context Gateway

on:
  push:
    branches:
      - main
      - 'platform/clover-context-gateway*'
    paths:
      - 'apps/clover-context-gateway/**'
      - 'portfolio/context/**'
      - 'portfolio/schemas/clover-command-packet.schema.json'
      - 'portfolio/schemas/clover-refresh-receipt.schema.json'
      - '.github/workflows/validate-clover-context-gateway.yml'
  pull_request:
    paths:
      - 'apps/clover-context-gateway/**'
      - 'portfolio/context/**'
      - 'portfolio/schemas/clover-command-packet.schema.json'
      - 'portfolio/schemas/clover-refresh-receipt.schema.json'
      - '.github/workflows/validate-clover-context-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/clover-context-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate source and deterministic router tests
        run: npm run validate
      - name: Smoke-test the HTTP and command APIs
        shell: bash
        run: |
          set -euo pipefail
          PORT=8787 npm start > "$RUNNER_TEMP/clover-context-gateway.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/ > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/command-center | grep 'Clover Command Center'
          curl --fail --silent \
            -H 'x-forwarded-proto: https' \
            -H 'x-forwarded-host: clover-preview.example' \
            http://127.0.0.1:8787/ > "$RUNNER_TEMP/forwarded-health.json"
          node - <<'NODE' "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/forwarded-health.json"
          const fs = require('node:fs');
          const local = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const forwarded = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (local.service !== 'clover-context-gateway') process.exit(11);
          if (local.version !== '0.1.1') process.exit(12);
          if (local.mode !== 'read-only') process.exit(13);
          if (forwarded.mcp !== 'https://clover-preview.example/mcp') process.exit(14);
          if (forwarded.commandCenter !== 'https://clover-preview.example/command-center') process.exit(15);
          NODE
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"request":"Use CloverApps to evolve RollinD through a preview only"}' \
            http://127.0.0.1:8787/api/prepare-command > "$RUNNER_TEMP/command.json"
          node - <<'NODE' "$RUNNER_TEMP/command.json"
          const fs = require('node:fs');
          const file = process.argv[2];
          const x = JSON.parse(fs.readFileSync(file, 'utf8'));
          const diagnostic = {
            topLevelKeys: Object.keys(x),
            packetKeys: Object.keys(x.packet || {}),
            project: x.packet?.project || null,
            intent: x.packet?.intent || null,
            authority: x.packet?.authority || null,
            errors: x.errors || x.error || null
          };
          console.log(JSON.stringify(diagnostic));
          if (x.packet?.project?.projectId !== 'rollindd') process.exit(21);
          if (x.packet?.authority?.productionDeploymentApproved !== false) process.exit(22);
          NODE
      - name: Upload smoke-test and lockfile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-context-gateway-${{ github.sha }}
          path: |
            apps/clover-context-gateway/package-lock.json
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/forwarded-health.json
            ${{ runner.temp }}/command.json
            ${{ runner.temp }}/clover-context-gateway.log
          if-no-files-found: warn
          retention-days: 30
