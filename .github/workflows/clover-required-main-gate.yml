name: Clover Required Main Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Clover required main gate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    env:
      CLOVER_VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTEXT_SOURCE_MODE: local
      CONTEXT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PUBLIC_BASE_URL: http://127.0.0.1:8787
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOVER_VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CLOVER_VALIDATION_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git diff --check

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/clover-context-gateway/package-lock.json

      - name: Prove pull-request integration context
        shell: bash
        env:
          CLOVER_EVENT_NAME: ${{ github.event_name }}
          CLOVER_REPOSITORY: ${{ github.repository }}
          CLOVER_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CLOVER_EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CLOVER_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLOVER_PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          CLOVER_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CLOVER_EVENT_MERGE_SHA: ${{ github.sha }}
        run: |
          # BEGIN CLOVER PR INTEGRATION CONTEXT V1
          set -Eeuo pipefail

          evidence_path="$RUNNER_TEMP/clover-pr-integration-context.json"
          export CLOVER_RESULT="failed"
          export CLOVER_FAILURE_STAGE="initialize"
          export CLOVER_ACTUAL_HEAD_SHA=""
          export CLOVER_HEAD_TREE=""
          export CLOVER_FETCHED_BASE_SHA=""
          export CLOVER_FETCHED_BASE_SHA_SECOND_READ=""
          export CLOVER_MERGE_BASE=""
          export CLOVER_FETCHED_MERGE_SHA=""
          export CLOVER_FETCHED_MERGE_SHA_SECOND_READ=""
          export CLOVER_SYNTHETIC_PARENT_1=""
          export CLOVER_SYNTHETIC_PARENT_2=""
          export CLOVER_SYNTHETIC_MERGE_TREE=""
          export CLOVER_BASE_IS_ANCESTOR=""
          export CLOVER_MERGE_TREE_EQUALS_HEAD_TREE=""

          is_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
          }

          write_evidence() {
            node <<'NODE' > "$evidence_path"
          const nullable = (name) => {
            const value = process.env[name];
            return value === undefined || value === '' ? null : value;
          };
          const integerOrNull = (name) => {
            const value = nullable(name);
            return value === null ? null : Number.parseInt(value, 10);
          };
          const booleanOrNull = (name) => {
            const value = nullable(name);
            if (value === null) return null;
            if (value !== 'true' && value !== 'false') throw new Error(`${name} is not boolean`);
            return value === 'true';
          };
          const result = process.env.CLOVER_RESULT;
          const evidence = {
            schemaVersion: 'clover-pr-integration-context-v1',
            eventName: process.env.CLOVER_EVENT_NAME,
            repository: process.env.CLOVER_REPOSITORY,
            pullRequestNumber: integerOrNull('CLOVER_PR_NUMBER'),
            headRef: nullable('CLOVER_EVENT_HEAD_REF'),
            headSha: nullable('CLOVER_EXPECTED_HEAD_SHA'),
            checkedOutHeadSha: nullable('CLOVER_ACTUAL_HEAD_SHA'),
            headTree: nullable('CLOVER_HEAD_TREE'),
            baseRef: nullable('CLOVER_PR_BASE_REF'),
            baseSha: nullable('CLOVER_PR_BASE_SHA'),
            fetchedBaseSha: nullable('CLOVER_FETCHED_BASE_SHA'),
            fetchedBaseShaSecondRead: nullable('CLOVER_FETCHED_BASE_SHA_SECOND_READ'),
            mergeBase: nullable('CLOVER_MERGE_BASE'),
            eventSyntheticMergeSha: process.env.CLOVER_EVENT_NAME === 'pull_request'
              ? nullable('CLOVER_EVENT_MERGE_SHA')
              : null,
            fetchedSyntheticMergeSha: nullable('CLOVER_FETCHED_MERGE_SHA'),
            fetchedSyntheticMergeShaSecondRead: nullable('CLOVER_FETCHED_MERGE_SHA_SECOND_READ'),
            syntheticMergeParent1: nullable('CLOVER_SYNTHETIC_PARENT_1'),
            syntheticMergeParent2: nullable('CLOVER_SYNTHETIC_PARENT_2'),
            syntheticMergeTree: nullable('CLOVER_SYNTHETIC_MERGE_TREE'),
            baseIsAncestorOfHead: booleanOrNull('CLOVER_BASE_IS_ANCESTOR'),
            syntheticMergeTreeEqualsHeadTree: booleanOrNull('CLOVER_MERGE_TREE_EQUALS_HEAD_TREE'),
            result,
            failureStage: result === 'failed' ? nullable('CLOVER_FAILURE_STAGE') : null
          };
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          }

          write_summary() {
            {
              printf '### Clover PR integration context\n\n'
              printf -- '- Result: %s\n' "$CLOVER_RESULT"
              printf -- '- Event: %s\n' "$CLOVER_EVENT_NAME"
              printf -- '- Head: %s\n' "${CLOVER_ACTUAL_HEAD_SHA:-not-applicable}"
              printf -- '- Head tree: %s\n' "${CLOVER_HEAD_TREE:-not-applicable}"
              printf -- '- Base: %s\n' "${CLOVER_FETCHED_BASE_SHA:-not-applicable}"
              printf -- '- Merge base: %s\n' "${CLOVER_MERGE_BASE:-not-applicable}"
              printf -- '- Synthetic merge: %s\n' "${CLOVER_FETCHED_MERGE_SHA:-not-applicable}"
              printf -- '- Synthetic merge tree: %s\n' "${CLOVER_SYNTHETIC_MERGE_TREE:-not-applicable}"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          on_error() {
            local exit_code=$?
            trap - ERR
            CLOVER_RESULT="failed"
            write_evidence || true
            write_summary || true
            exit "$exit_code"
          }
          trap on_error ERR

          CLOVER_FAILURE_STAGE="validate-common-event-identity"
          [[ "$CLOVER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          is_sha "$CLOVER_EXPECTED_HEAD_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          CLOVER_ACTUAL_HEAD_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          is_sha "$CLOVER_ACTUAL_HEAD_SHA"
          test "$CLOVER_ACTUAL_HEAD_SHA" = "$CLOVER_EXPECTED_HEAD_SHA"
          CLOVER_HEAD_TREE="$(git rev-parse --verify "${CLOVER_ACTUAL_HEAD_SHA}^{tree}")"
          is_sha "$CLOVER_HEAD_TREE"
          remote_url="$(git config --get remote.origin.url)"
          case "$remote_url" in
            "https://github.com/${CLOVER_REPOSITORY}"|"https://github.com/${CLOVER_REPOSITORY}.git"|"git@github.com:${CLOVER_REPOSITORY}.git") ;;
            *) false ;;
          esac

          case "$CLOVER_EVENT_NAME" in
            push|workflow_dispatch)
              CLOVER_RESULT="not-applicable-non-pr-event"
              CLOVER_FAILURE_STAGE="write-non-pr-evidence"
              write_evidence
              write_summary
              trap - ERR
              exit 0
              ;;
            pull_request) ;;
            *) false ;;
          esac

          CLOVER_FAILURE_STAGE="validate-pull-request-event-identity"
          [[ "$CLOVER_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test -n "$CLOVER_EVENT_HEAD_REF"
          test -n "$CLOVER_PR_BASE_REF"
          git check-ref-format "refs/heads/${CLOVER_EVENT_HEAD_REF}" > /dev/null
          git check-ref-format "refs/heads/${CLOVER_PR_BASE_REF}" > /dev/null
          is_sha "$CLOVER_PR_BASE_SHA"
          is_sha "$CLOVER_EVENT_MERGE_SHA"

          CLOVER_FAILURE_STAGE="fetch-first-pull-request-context"
          git fetch --no-tags --force origin \
            "+refs/heads/${CLOVER_PR_BASE_REF}:refs/clover/pr-integration-context/base-first"
          git fetch --no-tags --force origin \
            "+refs/pull/${CLOVER_PR_NUMBER}/merge:refs/clover/pr-integration-context/merge-first"
          CLOVER_FETCHED_BASE_SHA="$(git rev-parse --verify 'refs/clover/pr-integration-context/base-first^{commit}')"
          CLOVER_FETCHED_MERGE_SHA="$(git rev-parse --verify 'refs/clover/pr-integration-context/merge-first^{commit}')"
          is_sha "$CLOVER_FETCHED_BASE_SHA"
          is_sha "$CLOVER_FETCHED_MERGE_SHA"
          test "$CLOVER_FETCHED_BASE_SHA" = "$CLOVER_PR_BASE_SHA"
          test "$CLOVER_FETCHED_MERGE_SHA" = "$CLOVER_EVENT_MERGE_SHA"

          CLOVER_FAILURE_STAGE="validate-linear-integration-context"
          CLOVER_MERGE_BASE="$(git merge-base "$CLOVER_PR_BASE_SHA" "$CLOVER_ACTUAL_HEAD_SHA")"
          is_sha "$CLOVER_MERGE_BASE"
          test "$CLOVER_MERGE_BASE" = "$CLOVER_PR_BASE_SHA"
          CLOVER_BASE_IS_ANCESTOR="false"
          git merge-base --is-ancestor "$CLOVER_PR_BASE_SHA" "$CLOVER_ACTUAL_HEAD_SHA"
          CLOVER_BASE_IS_ANCESTOR="true"
          read -r -a synthetic_parents <<< "$(git show -s --format='%P' "$CLOVER_FETCHED_MERGE_SHA")"
          test "${#synthetic_parents[@]}" -eq 2
          CLOVER_SYNTHETIC_PARENT_1="${synthetic_parents[0]}"
          CLOVER_SYNTHETIC_PARENT_2="${synthetic_parents[1]}"
          test "$CLOVER_SYNTHETIC_PARENT_1" = "$CLOVER_PR_BASE_SHA"
          test "$CLOVER_SYNTHETIC_PARENT_2" = "$CLOVER_ACTUAL_HEAD_SHA"
          CLOVER_SYNTHETIC_MERGE_TREE="$(git rev-parse --verify "${CLOVER_FETCHED_MERGE_SHA}^{tree}")"
          is_sha "$CLOVER_SYNTHETIC_MERGE_TREE"
          CLOVER_MERGE_TREE_EQUALS_HEAD_TREE="false"
          test "$CLOVER_SYNTHETIC_MERGE_TREE" = "$CLOVER_HEAD_TREE"
          CLOVER_MERGE_TREE_EQUALS_HEAD_TREE="true"

          CLOVER_FAILURE_STAGE="verify-context-stability"
          git fetch --no-tags --force origin \
            "+refs/heads/${CLOVER_PR_BASE_REF}:refs/clover/pr-integration-context/base-second"
          git fetch --no-tags --force origin \
            "+refs/pull/${CLOVER_PR_NUMBER}/merge:refs/clover/pr-integration-context/merge-second"
          CLOVER_FETCHED_BASE_SHA_SECOND_READ="$(git rev-parse --verify 'refs/clover/pr-integration-context/base-second^{commit}')"
          CLOVER_FETCHED_MERGE_SHA_SECOND_READ="$(git rev-parse --verify 'refs/clover/pr-integration-context/merge-second^{commit}')"
          is_sha "$CLOVER_FETCHED_BASE_SHA_SECOND_READ"
          is_sha "$CLOVER_FETCHED_MERGE_SHA_SECOND_READ"
          test "$CLOVER_FETCHED_BASE_SHA_SECOND_READ" = "$CLOVER_FETCHED_BASE_SHA"
          test "$CLOVER_FETCHED_MERGE_SHA_SECOND_READ" = "$CLOVER_FETCHED_MERGE_SHA"
          test "$CLOVER_FETCHED_BASE_SHA_SECOND_READ" = "$CLOVER_PR_BASE_SHA"
          test "$CLOVER_FETCHED_MERGE_SHA_SECOND_READ" = "$CLOVER_EVENT_MERGE_SHA"

          CLOVER_RESULT="passed"
          CLOVER_FAILURE_STAGE="write-passed-evidence"
          write_evidence
          write_summary
          trap - ERR
          # END CLOVER PR INTEGRATION CONTEXT V1

      - name: Install pinned validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund ajv@8.17.1
          npm ci --prefix apps/clover-context-gateway --ignore-scripts --no-audit --no-fund

      - name: Validate source structure, document parsing, and action pins
        shell: bash
        env:
          CLOVER_EVENT_NAME: ${{ github.event_name }}
          CLOVER_EVENT_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          git diff --check
          case "$CLOVER_EVENT_NAME" in
            pull_request)
              CLOVER_DIFF_BASE="$(node -p "require(process.env.RUNNER_TEMP + '/clover-pr-integration-context.json').baseSha")"
              ;;
            push)
              CLOVER_DIFF_BASE="$CLOVER_EVENT_BEFORE_SHA"
              [[ "$CLOVER_DIFF_BASE" =~ ^[0-9a-f]{40}$ ]]
              test "$CLOVER_DIFF_BASE" != "0000000000000000000000000000000000000000"
              ;;
            workflow_dispatch)
              read -r CLOVER_DIFF_BASE _ <<< "$(git show -s --format='%P' "$CLOVER_VALIDATION_SHA")"
              ;;
            *)
              false
              ;;
          esac
          export CLOVER_DIFF_BASE
          [[ "$CLOVER_DIFF_BASE" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${CLOVER_DIFF_BASE}^{commit}"
          git diff --check "$CLOVER_DIFF_BASE" "$CLOVER_VALIDATION_SHA"
          git fsck --full --strict
          ruby -e 'require "yaml"; ARGV.each { |path| raise "empty YAML: #{path}" unless Psych.parse_file(path) }' $(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')
          ruby <<'RUBY' > "$RUNNER_TEMP/clover-workflow-policy.json"
          require "json"
          require "open3"
          require "yaml"

          def collect_uses(node, path, action_uses, checkout_steps)
            case node
            when Hash
              if node.key?("uses")
                value = node.fetch("uses")
                raise "non-string uses value in #{path}" unless value.is_a?(String)
                action_uses << { "path" => path, "value" => value }
                if value.match?(/\Aactions\/checkout@[0-9a-f]{40}\z/i)
                  with = node["with"]
                  persisted = with.is_a?(Hash) ? with["persist-credentials"] : nil
                  checkout_steps << {
                    "path" => path,
                    "value" => value,
                    "persistCredentialsFalse" => persisted == false || persisted == "false"
                  }
                end
              end
              node.each_value { |value| collect_uses(value, path, action_uses, checkout_steps) }
            when Array
              node.each { |value| collect_uses(value, path, action_uses, checkout_steps) }
            end
          end

          checkout_sha = "0123456789abcdef0123456789abcdef01234567"
          fixture = YAML.safe_load(<<~YAML, aliases: false)
            jobs:
              audit:
                steps:
                  - uses : attacker/block@v1
                  - "uses": attacker/quoted@v2 # valid YAML inline comment
                  - { uses: attacker/flow@v3 }
                  - uses: >-
                      attacker/folded@v4
                  - name: unsafe checkout
                    uses: Actions/Checkout@#{checkout_sha}
                    env: { NOTE: "persist-credentials: false" }
                    # persist-credentials: false
                  - name: safe terminal checkout
                    uses : actions/checkout@#{checkout_sha} # valid YAML inline comment
                    with: { persist-credentials: false }
                  - run: echo next-step
          YAML
          fixture_uses = []
          fixture_checkouts = []
          collect_uses(fixture, "adversarial-fixture", fixture_uses, fixture_checkouts)
          expected_fixture_uses = [
            "attacker/block@v1",
            "attacker/quoted@v2",
            "attacker/flow@v3",
            "attacker/folded@v4",
            "Actions/Checkout@#{checkout_sha}",
            "actions/checkout@#{checkout_sha}"
          ]
          raise "semantic uses parser missed a YAML representation" unless fixture_uses.map { |entry| entry.fetch("value") } == expected_fixture_uses
          raise "unsafe checkout fixture was accepted" unless fixture_checkouts.length == 2 && fixture_checkouts.first.fetch("persistCredentialsFalse") == false
          raise "safe terminal checkout fixture was rejected" unless fixture_checkouts.last.fetch("persistCredentialsFalse") == true

          tracked, status = Open3.capture2("git", "ls-files", "-z")
          raise "git ls-files failed" unless status.success?
          tracked_files = tracked.split("\0").reject(&:empty?)
          workflow_files = tracked_files.select { |path| path.match?(%r{\A\.github/workflows/.*\.ya?ml\z}) }.sort
          action_metadata_files = tracked_files.select { |path| path.match?(%r{(?:\A|/)action\.ya?ml\z}) }.sort
          policy_files = workflow_files + action_metadata_files
          action_uses = []
          checkout_steps = []
          policy_files.each do |path|
            document = YAML.safe_load(File.read(path), aliases: false)
            raise "empty YAML: #{path}" if document.nil?
            collect_uses(document, path, action_uses, checkout_steps)
          end
          unpinned = action_uses.reject { |entry| entry.fetch("value").start_with?("./") || entry.fetch("value").match?(/@[0-9a-f]{40}\z/) }
          raise "unpinned workflow actions: #{unpinned.to_json}" unless unpinned.empty?
          credential_violations = checkout_steps.reject { |entry| entry.fetch("persistCredentialsFalse") }
          raise "checkout credential violations: #{credential_violations.to_json}" unless credential_violations.empty?
          puts JSON.generate({
            "workflowFiles" => workflow_files,
            "actionMetadataFiles" => action_metadata_files,
            "actionUses" => action_uses,
            "checkoutSteps" => checkout_steps
          })
          RUBY
          node <<'NODE' > "$RUNNER_TEMP/clover-source-integrity.json"
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const crypto = require('node:crypto');
          const tracked = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const jsonFiles = tracked.filter((path) => path.endsWith('.json'));
          const jsonlFiles = tracked.filter((path) => path.endsWith('.jsonl'));
          let jsonlRecords = 0;
          for (const path of jsonFiles) JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const path of jsonlFiles) {
            const records = fs.readFileSync(path, 'utf8').split(/\r?\n/).filter((line) => line.trim());
            for (const record of records) JSON.parse(record);
            jsonlRecords += records.length;
          }
          const workflowFiles = tracked.filter((path) => /^\.github\/workflows\/.*\.ya?ml$/.test(path));
          const workflowPolicy = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/clover-workflow-policy.json', 'utf8'));
          const uses = workflowPolicy.actionUses;
          const unpinned = uses.filter(({ value }) => !value.startsWith('./') && !/@[0-9a-f]{40}$/.test(value));
          if (unpinned.length) throw new Error(`unpinned workflow actions: ${JSON.stringify(unpinned)}`);
          const checkoutBlocks = workflowPolicy.checkoutSteps;
          const credentialViolations = checkoutBlocks.filter(({ persistCredentialsFalse }) => !persistCredentialsFalse);
          if (credentialViolations.length) throw new Error(`checkout credential violations: ${JSON.stringify(credentialViolations)}`);
          const workflowPath = '.github/workflows/clover-required-main-gate.yml';
          const workflowBytes = fs.readFileSync(workflowPath);
          const workflowText = workflowBytes.toString('utf8');
          const requiredFragments = [
            'name: Clover Required Main Gate',
            'on:\n  pull_request:\n    branches:\n      - main\n  push:\n    branches:\n      - main\n  workflow_dispatch:',
            'jobs:\n  validate:',
            'name: Clover required main gate (Node $' + '{{ matrix.node-version }})',
            "node-version: ['22', '24']",
            'permissions:\n  contents: read',
            'persist-credentials: false',
            'fetch-depth: 0'
          ];
          for (const fragment of requiredFragments) {
            if (!workflowText.includes(fragment)) throw new Error(`missing workflow contract: ${fragment}`);
          }
          const triggerPrefix = workflowText.slice(0, workflowText.indexOf('\npermissions:'));
          if (/\n\s+paths(?:-ignore)?:/.test(triggerPrefix)) throw new Error('required gate must not contain event path filters');
          if (/pull_request_target:|merge_group:|schedule:/.test(triggerPrefix)) throw new Error('unauthorized workflow trigger');
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          if (head !== process.env.CLOVER_VALIDATION_SHA) throw new Error('source identity changed');
          process.stdout.write(`${JSON.stringify({
            status: 'passed',
            head,
            tree,
            diffBase: process.env.CLOVER_DIFF_BASE,
            committedRangeDiffCheck: 'passed',
            jsonFiles: jsonFiles.length,
            jsonlFiles: jsonlFiles.length,
            jsonlRecords,
            yamlFiles: workflowFiles.length,
            actionMetadataFiles: workflowPolicy.actionMetadataFiles.length,
            actionUses: uses.length,
            fullShaPinnedActionUses: uses.filter(({ value }) => !value.startsWith('./')).length,
            checkoutBlocks: checkoutBlocks.length,
            checkoutCredentialsDisabled: true,
            workflowPath,
            workflowSha256: crypto.createHash('sha256').update(workflowBytes).digest('hex')
          }, null, 2)}\n`);
          NODE

      - name: Verify privacy and default-deny authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/clover-privacy-result.json"
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { TextDecoder } = require('node:util');

          const fatalUtf8 = new TextDecoder('utf-8', { fatal: true });
          const regularModes = new Set(['100644', '100755']);
          const excludedSegments = new Set(['test', 'tests', 'fixture', 'fixtures']);
          const pathListEncoding = 'bytewise-sorted UTF-8 paths, each terminated by one NUL byte';
          const patterns = [
            ['private-key', /-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----/g],
            ['github-token', /\bgh[oprsu]_[A-Za-z0-9]{20,}\b/g],
            ['openai-token', /\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b/g],
            ['aws-access-key', /\bAKIA[0-9A-Z]{16}\b/g],
            ['bearer-token', /\bBearer\s+[A-Za-z0-9._~+\/-]{20,}={0,2}\b/gi],
            ['local-user-path', /(?:\/Users\/[^/\s"']+|\/home\/[^/\s"']+|[A-Za-z]:\\Users\\[^\\\s"']+)/g],
            ['email-address', /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/gi]
          ];

          function comparePaths(left, right) {
            return Buffer.compare(Buffer.from(left, 'utf8'), Buffer.from(right, 'utf8'));
          }

          function sortedEntries(entries) {
            return [...entries].sort((left, right) => comparePaths(left.path, right.path));
          }

          function pathListSha256(paths) {
            const hash = crypto.createHash('sha256');
            for (const path of [...paths].sort(comparePaths)) {
              hash.update(Buffer.from(path, 'utf8'));
              hash.update(Buffer.from([0]));
            }
            return hash.digest('hex');
          }

          function parseTrackedEntries() {
            const raw = execFileSync('git', ['ls-files', '--stage', '-z'], { maxBuffer: 64 * 1024 * 1024 });
            const entries = [];
            const seenPaths = new Set();
            let start = 0;
            while (start < raw.length) {
              const end = raw.indexOf(0, start);
              if (end === -1) throw new Error('git index inventory is not NUL terminated');
              const record = raw.subarray(start, end);
              start = end + 1;
              if (record.length === 0) continue;
              const tab = record.indexOf(9);
              if (tab === -1) throw new Error('git index inventory record has no path separator');
              const metadata = record.subarray(0, tab).toString('ascii').split(' ');
              if (metadata.length !== 3) throw new Error('git index inventory metadata is malformed');
              const [mode, oid, stage] = metadata;
              if (!/^\d{6}$/.test(mode)) throw new Error(`invalid Git mode: ${mode}`);
              if (!/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/.test(oid)) throw new Error(`invalid Git object ID: ${oid}`);
              if (stage !== '0') throw new Error(`unmerged Git index entry at stage ${stage}`);
              let path;
              try {
                path = fatalUtf8.decode(record.subarray(tab + 1));
              } catch {
                throw new Error('tracked path is not valid UTF-8');
              }
              if (!path || seenPaths.has(path)) throw new Error(`invalid or duplicate tracked path: ${path}`);
              seenPaths.add(path);
              entries.push({ path, mode, oid, stage: 0 });
            }
            return sortedEntries(entries);
          }

          function hasExcludedSegment(path) {
            return path.split('/').some((segment) => excludedSegments.has(segment));
          }

          function isSafeGitHubSshTransport(text, match, index) {
            const identity = ['git', 'github.com'].join('@');
            if (match !== identity) return false;
            const before = index === 0 ? '' : text[index - 1];
            if (before && !/[\s"'`(=\[{]/.test(before)) return false;
            const remainder = text.slice(index + match.length);
            const literalRemote = /^:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\.git(?=$|[\s"'`),;\]}])/;
            const repositoryVariableRemote = /^:\$\{CLOVER_REPOSITORY\}\.git(?=$|[\s"'`),;\]}])/;
            return literalRemote.test(remainder) || repositoryVariableRemote.test(remainder);
          }

          function positionFor(text, index) {
            const prefix = text.slice(0, index);
            const lines = prefix.split('\n');
            return { line: lines.length, column: lines[lines.length - 1].length + 1 };
          }

          function scanText(path, text) {
            const findings = [];
            for (const [kind, pattern] of patterns) {
              pattern.lastIndex = 0;
              for (let match = pattern.exec(text); match; match = pattern.exec(text)) {
                if (kind === 'email-address' && isSafeGitHubSshTransport(text, match[0], match.index)) continue;
                findings.push({ path, kind, ...positionFor(text, match.index) });
                if (match[0].length === 0) pattern.lastIndex += 1;
              }
            }
            return findings;
          }

          function evaluateInventory(inputEntries, readBytes) {
            const entries = sortedEntries(inputEntries);
            const trackedEntries = entries.map(({ path, mode, oid, stage }) => ({ path, mode, oid, stage }));
            const excludedNonRegularEntries = [];
            const excludedTestFixtureEntries = [];
            const excludedBinaryOrNonUtf8Entries = [];
            const eligibleEntries = [];
            const scannedEntries = [];
            const findings = [];
            let regularTrackedFiles = 0;
            let scannedBytes = 0;

            for (const entry of entries) {
              if (!regularModes.has(entry.mode)) {
                excludedNonRegularEntries.push({ path: entry.path, mode: entry.mode, oid: entry.oid });
                continue;
              }
              regularTrackedFiles += 1;
              if (hasExcludedSegment(entry.path)) {
                excludedTestFixtureEntries.push({ path: entry.path, mode: entry.mode, oid: entry.oid });
                continue;
              }
              const bytes = readBytes(entry);
              if (!Buffer.isBuffer(bytes)) throw new Error(`tracked byte reader returned a non-Buffer for ${entry.path}`);
              if (bytes.includes(0)) {
                excludedBinaryOrNonUtf8Entries.push({ path: entry.path, mode: entry.mode, oid: entry.oid, bytes: bytes.length, reason: 'nul-byte' });
                continue;
              }
              let text;
              try {
                text = fatalUtf8.decode(bytes);
              } catch {
                excludedBinaryOrNonUtf8Entries.push({ path: entry.path, mode: entry.mode, oid: entry.oid, bytes: bytes.length, reason: 'invalid-utf8' });
                continue;
              }
              const record = { path: entry.path, mode: entry.mode, oid: entry.oid, bytes: bytes.length };
              eligibleEntries.push(record);
              findings.push(...scanText(entry.path, text));
              scannedEntries.push(record);
              scannedBytes += bytes.length;
            }

            const eligiblePaths = eligibleEntries.map(({ path }) => path);
            const scannedPaths = scannedEntries.map(({ path }) => path);
            const scannedSet = new Set(scannedPaths);
            const uncoveredEligiblePaths = eligiblePaths.filter((path) => !scannedSet.has(path));
            const eligiblePathListSha256 = pathListSha256(eligiblePaths);
            const scannedPathListSha256 = pathListSha256(scannedPaths);
            const pathListsEqual = eligiblePaths.length === scannedPaths.length
              && eligiblePathListSha256 === scannedPathListSha256
              && uncoveredEligiblePaths.length === 0;
            findings.sort((left, right) => comparePaths(left.path, right.path)
              || left.line - right.line
              || left.column - right.column
              || comparePaths(left.kind, right.kind));

            return {
              schemaVersion: 1,
              status: pathListsEqual && findings.length === 0 ? 'passed' : 'failed',
              scope: 'every tracked ordinary regular non-test valid-UTF-8 Git blob',
              sourceAuthority: 'git index mode and object inventory',
              pathListEncoding,
              totalTrackedEntries: trackedEntries.length,
              regularTrackedFiles,
              excludedNonRegularFiles: excludedNonRegularEntries.length,
              excludedTestFixtureFiles: excludedTestFixtureEntries.length,
              excludedBinaryOrNonUtf8Files: excludedBinaryOrNonUtf8Entries.length,
              eligibleTextFiles: eligibleEntries.length,
              scannedFiles: scannedEntries.length,
              scannedBytes,
              findingCount: findings.length,
              uncoveredEligiblePaths,
              eligiblePathListSha256,
              scannedPathListSha256,
              pathListsEqual,
              privateDataAccessed: false,
              trackedEntries,
              excludedNonRegularEntries,
              excludedTestFixtureEntries,
              excludedBinaryOrNonUtf8Entries,
              eligibleEntries,
              scannedEntries,
              findings
            };
          }

          function enforceCoverage(result, { allowFindings = false } = {}) {
            if (result.eligibleTextFiles !== result.scannedFiles) throw new Error('eligible and scanned file counts differ');
            if (!result.pathListsEqual) throw new Error('eligible and scanned path inventories differ');
            if (result.uncoveredEligiblePaths.length !== 0) throw new Error('eligible tracked paths were not scanned');
            if (!allowFindings && result.findingCount !== 0) throw new Error(`sensitive tracked content: ${JSON.stringify(result.findings)}`);
          }

          function verifyMandatoryCoverage(result, requestedPaths) {
            const trackedSet = new Set(result.trackedEntries.map(({ path }) => path));
            const eligibleSet = new Set(result.eligibleEntries.map(({ path }) => path));
            const scannedSet = new Set(result.scannedEntries.map(({ path }) => path));
            const requested = [...requestedPaths].sort(comparePaths);
            const present = requested.filter((path) => trackedSet.has(path));
            const absent = requested.filter((path) => !trackedSet.has(path));
            const presentButIneligible = present.filter((path) => !eligibleSet.has(path));
            const presentButUnscanned = present.filter((path) => !scannedSet.has(path));
            if (presentButIneligible.length || presentButUnscanned.length) {
              throw new Error(`mandatory present privacy paths are not covered: ${JSON.stringify({ presentButIneligible, presentButUnscanned })}`);
            }
            return {
              requestedPaths: requested,
              presentPaths: present,
              absentPaths: absent,
              requestedCount: requested.length,
              presentCount: present.length,
              absentCount: absent.length,
              presentPathsEligibleAndScanned: true
            };
          }

          function syntheticEntry(path, bytes, mode = '100644', marker = 'a') {
            return { path, mode, oid: marker.repeat(40), stage: 0, bytes: Buffer.from(bytes) };
          }

          function runAdversarialCoverage() {
            const githubToken = ['gh', 'p_', 'A'.repeat(24)].join('');
            const openAiToken = ['sk-', 'proj-', 'B'.repeat(24)].join('');
            const bearerToken = ['Be', 'arer ', 'C'.repeat(24)].join('');
            const privateKeyHeader = ['-----BEGIN ', 'PRIVATE KEY', '-----'].join('');
            const localUserPath = ['/Us', 'ers/', 'synthetic-owner', '/private.txt'].join('');
            const ordinaryEmail = ['owner', 'example.com'].join('@');
            const githubEmail = ['someone', 'github.com'].join('@');
            const githubSshIdentity = ['git', 'github.com'].join('@');
            const fixtures = [
              syntheticEntry('.github/workflows/synthetic.yml', githubToken),
              syntheticEntry('apps/clover-context-gateway/server.js', openAiToken),
              syntheticEntry('apps/clover-context-gateway/lib/synthetic.js', bearerToken),
              syntheticEntry('apps/clover-context-gateway/package.json', privateKeyHeader),
              syntheticEntry('scripts/synthetic.sh', localUserPath, '100755'),
              syntheticEntry('.env.example', ordinaryEmail),
              syntheticEntry('transport/safe-ssh.txt', `${githubSshIdentity}:owner/repository.git`),
              syntheticEntry('transport/safe-variable-ssh.txt', `${githubSshIdentity}:\${CLOVER_REPOSITORY}.git`),
              syntheticEntry('transport/github-email.txt', githubEmail),
              syntheticEntry('transport/bare-ssh.txt', githubSshIdentity),
              syntheticEntry('transport/suffix-ssh.txt', `${githubSshIdentity}:owner/repository.git.evil`),
              syntheticEntry('test/excluded.js', githubToken),
              syntheticEntry('tests/excluded.js', githubToken),
              syntheticEntry('fixture/excluded.js', githubToken),
              syntheticEntry('fixtures/excluded.js', githubToken),
              syntheticEntry('contest/eligible.txt', 'safe'),
              syntheticEntry('tester/eligible.txt', 'safe'),
              syntheticEntry('fixture-data/eligible.txt', 'safe'),
              syntheticEntry('empty/eligible.txt', Buffer.alloc(0)),
              syntheticEntry('binary/nul.bin', Buffer.from([0, 65])),
              syntheticEntry('binary/invalid-utf8.bin', Buffer.from([0xc3, 0x28])),
              syntheticEntry('links/not-regular', 'not dereferenced', '120000'),
              syntheticEntry('submodule/not-regular', 'not dereferenced', '160000')
            ];
            const readBytes = (entry) => entry.bytes;
            const first = evaluateInventory(fixtures, readBytes);
            const reversed = evaluateInventory([...fixtures].reverse(), readBytes);
            const repeated = evaluateInventory(fixtures, readBytes);
            assert.deepEqual(first, reversed, 'path ordering changed the coverage result');
            assert.equal(JSON.stringify(first), JSON.stringify(repeated), 'repeated coverage execution was not byte-identical');
            enforceCoverage(first, { allowFindings: true });

            const expectedFindings = new Map([
              ['.github/workflows/synthetic.yml', 'github-token'],
              ['apps/clover-context-gateway/server.js', 'openai-token'],
              ['apps/clover-context-gateway/lib/synthetic.js', 'bearer-token'],
              ['apps/clover-context-gateway/package.json', 'private-key'],
              ['scripts/synthetic.sh', 'local-user-path'],
              ['.env.example', 'email-address'],
              ['transport/github-email.txt', 'email-address'],
              ['transport/bare-ssh.txt', 'email-address'],
              ['transport/suffix-ssh.txt', 'email-address']
            ]);
            for (const [path, kind] of expectedFindings) {
              assert(first.findings.some((finding) => finding.path === path && finding.kind === kind), `missing adversarial ${kind} finding for ${path}`);
            }
            assert(!first.findings.some(({ path }) => path.startsWith('transport/safe-')), 'safe GitHub SSH transport was not narrowly exempted');
            assert.equal(first.excludedTestFixtureFiles, 4, 'exact test/fixture segment exclusions changed');
            for (const path of ['contest/eligible.txt', 'tester/eligible.txt', 'fixture-data/eligible.txt', 'empty/eligible.txt', 'scripts/synthetic.sh']) {
              assert(first.eligibleEntries.some((entry) => entry.path === path), `expected eligible adversarial path missing: ${path}`);
            }
            assert(first.excludedBinaryOrNonUtf8Entries.some(({ path, reason }) => path === 'binary/nul.bin' && reason === 'nul-byte'));
            assert(first.excludedBinaryOrNonUtf8Entries.some(({ path, reason }) => path === 'binary/invalid-utf8.bin' && reason === 'invalid-utf8'));
            assert(first.excludedNonRegularEntries.some(({ path, mode }) => path === 'links/not-regular' && mode === '120000'));
            assert(first.excludedNonRegularEntries.some(({ path, mode }) => path === 'submodule/not-regular' && mode === '160000'));
            assert.throws(() => enforceCoverage(first), /sensitive tracked content/, 'regular non-test finding did not fail closed');
            const conditionalMandatory = verifyMandatoryCoverage(first, ['absent/mandatory.txt', 'apps/clover-context-gateway/server.js']);
            assert.deepEqual(conditionalMandatory.presentPaths, ['apps/clover-context-gateway/server.js']);
            assert.deepEqual(conditionalMandatory.absentPaths, ['absent/mandatory.txt']);
            return {
              status: 'passed',
              matrixCases: fixtures.length,
              requiredSensitiveKindsDetected: 6,
              safeGitHubSshTransportAccepted: true,
              ordinaryGitHubEmailRejected: true,
              exactTestFixtureSegmentsExcluded: 4,
              nearMatchSegmentsEligible: true,
              nulAndInvalidUtf8ClassifiedSeparately: true,
              emptyTextEligibleAndScanned: true,
              regularExecutableEligibleAndScanned: true,
              nonRegularModesExcludedWithoutDereference: true,
              regularNonTestFindingFailsClosed: true,
              absentMandatoryPathHandledConditionally: true,
              pathOrderIndependent: true,
              repeatedExecutionByteIdentical: true
            };
          }

          const mandatoryCoveragePaths = [
            '.github/workflows/clover-required-main-gate.yml',
            'apps/clover-context-gateway/server.js',
            'apps/clover-context-gateway/lib/command-router.js',
            'apps/clover-context-gateway/lib/context-store.js',
            'apps/clover-context-gateway/scripts/mcp-smoke.mjs',
            'apps/clover-context-gateway/package.json',
            'apps/clover-context-gateway/package-lock.json',
            'apps/clover-context-gateway/public/command-center.html',
            'portfolio/core/CAPABILITY_AUTHORITY_REGISTRY.json',
            'CLOVER_CONTEXT_GATEWAY_POINTER.json'
          ];
          const trackedEntries = parseTrackedEntries();
          const result = evaluateInventory(trackedEntries, ({ oid }) => execFileSync('git', ['cat-file', 'blob', oid], { maxBuffer: 64 * 1024 * 1024 }));
          result.mandatoryCoverage = verifyMandatoryCoverage(result, mandatoryCoveragePaths);
          result.adversarialCoverage = runAdversarialCoverage();
          enforceCoverage(result);
          process.stdout.write(`${JSON.stringify(result, null, 2)}\n`);
          NODE
          node <<'NODE' > "$RUNNER_TEMP/clover-authority-boundary.json"
          const fs = require('node:fs');
          const registry = JSON.parse(fs.readFileSync('portfolio/core/CAPABILITY_AUTHORITY_REGISTRY.json', 'utf8'));
          const pointer = JSON.parse(fs.readFileSync('CLOVER_CONTEXT_GATEWAY_POINTER.json', 'utf8'));
          const controlPlane = JSON.parse(fs.readFileSync('portfolio/context/control-plane.json', 'utf8'));
          if (registry.defaultDeny !== true) throw new Error('Core default deny is not enabled');
          if (registry.standingProductionAuthority !== false) throw new Error('standing production authority widened');
          if (registry.standingPrivateDataAuthority !== false) throw new Error('standing private-data authority widened');
          if (registry.standingSecretRevealAuthority !== false) throw new Error('standing secret authority widened');
          if (registry.systems.some((system) => system.capabilities.execute_production === 'allow')) throw new Error('production execution allowed');
          if (pointer.writeToolsEnabled !== false || pointer.standingProductionAuthority !== false) throw new Error('Gateway pointer authority widened');
          if (controlPlane.authority.writeToolsEnabled !== false || controlPlane.authority.productionDataAccessEnabled !== false) throw new Error('control-plane authority widened');
          process.stdout.write(`${JSON.stringify({
            status: 'passed',
            node: process.version,
            defaultDeny: true,
            writeToolsEnabled: false,
            standingProductionAuthority: false,
            standingPrivateDataAuthority: false,
            standingSecretRevealAuthority: false,
            consequentialAuthorityGranted: false
          }, null, 2)}\n`);
          NODE

