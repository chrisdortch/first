            'node standards/clover-build-protocol/runtime/v1.1.0/validate-json.mjs standards/clover-build-protocol/schemas/project-registry.schema.json standards/clover-build-protocol/registry/projects.json',
            'node standards/clover-build-protocol/runtime/v1.1.0/validate-json.mjs standards/clover-build-protocol/schemas/project-policy.schema.json standards/clover-build-protocol/templates/project-policy.template.json',
            'node standards/clover-build-protocol/runtime/v1.1.0/validate-standard.mjs',
            'node standards/clover-build-protocol/runtime/v1.2.0/validate-json.mjs standards/clover-build-protocol/schemas/v1.2.0/project-policy.schema.json standards/clover-build-protocol/templates/v1.2.0/project-policy.template.json',
            'node standards/clover-build-protocol/runtime/v1.2.0/validate-json.mjs standards/clover-build-protocol/schemas/v1.2.0/enrollment.schema.json standards/clover-build-protocol/templates/v1.2.0/enrollment.template.json',
            'node standards/clover-build-protocol/runtime/v1.2.0/validate-standard.mjs',
            'node --test standards/clover-build-protocol/runtime/v1.2.0/test/*.test.mjs',
            'node standards/clover-build-protocol/runtime/v1.1.0/validate-json.mjs standards/clover-data-change-protocol/schemas/1.0.1/protocol-pointer.schema.json CLOVER_DATA_CHANGE_PROTOCOL_POINTER.json',
            'node standards/clover-build-protocol/runtime/v1.1.0/validate-json.mjs standards/clover-data-change-protocol/schemas/data-project-registry.schema.json standards/clover-data-change-protocol/registry/projects.json',
            'node standards/clover-build-protocol/runtime/v1.1.0/validate-json.mjs standards/clover-data-change-protocol/schemas/data-change-policy.schema.json standards/clover-data-change-protocol/templates/data-change-policy.template.json',
            'node standards/clover-build-protocol/runtime/v1.1.0/validate-json.mjs standards/clover-data-change-protocol/schemas/1.0.1/data-change-policy.schema.json standards/clover-data-change-protocol/templates/data-change-policy.v1.0.1.template.json',
            'node standards/clover-build-protocol/runtime/v1.1.0/validate-json.mjs standards/clover-data-change-protocol/schemas/1.0.1/data-change-receipt.schema.json standards/clover-data-change-protocol/schemas/1.0.1/fixtures/data-change-receipt.failed.fixture.json',
            'node --check standards/clover-data-change-protocol/runtime/v1.0.0/{verify-data-boundaries,run-project-command,data-rehearsal,assemble-data-receipt,validate-data-standard}.mjs (expanded as five exact commands)',
            'node --check standards/clover-data-change-protocol/runtime/v1.0.1/{sql-safety,role-safety,integrity,capture-state,verify-state,verify-final-receipt,validate-json,verify-data-boundaries,run-project-command,data-rehearsal,assemble-data-receipt,validate-data-standard}.mjs (expanded as twelve exact commands)',
            'node --test standards/clover-data-change-protocol/runtime/v1.0.1/test/hardening.test.mjs',
            'node standards/clover-data-change-protocol/runtime/v1.0.0/validate-data-standard.mjs',
            'node standards/clover-data-change-protocol/runtime/v1.0.1/validate-data-standard.mjs',
            'node --test portfolio/core/test/*.test.mjs',
            'node portfolio/core/scripts/verify-core.mjs',
            'node portfolio/runtime/validate-core-activation.mjs',
            'node portfolio/core/scripts/verify-publication-finalization.mjs',
            'npm run validate (apps/clover-context-gateway)',
            'PORT=8787 npm start (ephemeral localhost only)',
            'GET /, /command-center, /mcp=405, and /owner-mcp=405 smoke assertions',
            'npm run --silent smoke:mcp (apps/clover-context-gateway)',
            'verify final exact HEAD, clean repository, diff check, and strict fsck'
          ];
          process.stdout.write(`${JSON.stringify({
            schemaVersion: 'clover-required-main-gate-command-inventory-v1',
            workflowIsCompleteExecutableInventory: true,
            workflowPath: '.github/workflows/clover-required-main-gate.yml',
            commands
          }, null, 2)}\n`);
          NODE
          node <<'NODE' > "$RUNNER_TEMP/clover-required-main-gate-summary.json"
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const read = (name) => JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, 'utf8'));
          const sha256 = (path) => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const source = read('clover-source-integrity.json');
          const privacy = read('clover-privacy-result.json');
          const authority = read('clover-authority-boundary.json');
          const tools = read('clover-required-main-gate-tool-surface.json');
          const integration = read('clover-pr-integration-context.json');
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          if (head !== process.env.CLOVER_VALIDATION_SHA) throw new Error('final source identity changed');
          const summary = {
            schemaVersion: 'clover-required-main-gate-evidence-v1',
            status: 'passed',
            eventName: process.env.CLOVER_EVENT_NAME,
            repository: process.env.CLOVER_REPOSITORY,
            headRef: process.env.CLOVER_EVENT_HEAD_REF,
            headSha: head,
            headTree: tree,
            nodeMatrixVersion: process.env.CLOVER_NODE_VERSION,
            nodeRuntimeVersion: process.version,
            integrationContextResult: integration.result,
            validation: {
              sourceIntegrity: 'passed',
              masterAndRegistry: 'passed',
              buildCurrentAndCandidate: 'passed',
              dataCurrentAndCandidate: 'passed',
              coreAndHandoff: 'passed',
              activationAndPublication: 'passed',
              gateway: 'passed',
              technicalAndOwnerMcp: 'passed',
              tenRouteParityAndRequestIntegrity: 'passed'
            },
            toolSurface: tools,
            authority,
            privacy,
            workflow: {
              path: source.workflowPath,
              sha256: source.workflowSha256
            },
            integrationContextSha256: sha256(`${process.env.RUNNER_TEMP}/clover-pr-integration-context.json`),
            workflowPolicySha256: sha256(`${process.env.RUNNER_TEMP}/clover-workflow-policy.json`),
            gatewayLockfileSha256: sha256('apps/clover-context-gateway/package-lock.json'),
            commandInventorySha256: sha256(`${process.env.RUNNER_TEMP}/clover-required-main-gate-command-inventory.json`)
          };
          process.stdout.write(`${JSON.stringify(summary, null, 2)}\n`);
          NODE

      - name: Finalize deterministic evidence manifest
        if: always()
        shell: bash
        env:
          CLOVER_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          node <<'NODE' > "$RUNNER_TEMP/clover-required-main-gate-evidence-manifest.json"
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const entries = [
            ['workflow', '.github/workflows/clover-required-main-gate.yml'],
            ['gateway-lockfile', 'apps/clover-context-gateway/package-lock.json'],
            ['integration-context', `${process.env.RUNNER_TEMP}/clover-pr-integration-context.json`],
            ['workflow-policy', `${process.env.RUNNER_TEMP}/clover-workflow-policy.json`],
            ['source-integrity', `${process.env.RUNNER_TEMP}/clover-source-integrity.json`],
            ['privacy', `${process.env.RUNNER_TEMP}/clover-privacy-result.json`],
            ['authority', `${process.env.RUNNER_TEMP}/clover-authority-boundary.json`],
            ['master-plan', `${process.env.RUNNER_TEMP}/clover-master-plan-validation.json`],
            ['registry-v2', `${process.env.RUNNER_TEMP}/clover-registry-v2-validation.json`],
            ['build-current', `${process.env.RUNNER_TEMP}/clover-build-current-validation.json`],
            ['build-candidate', `${process.env.RUNNER_TEMP}/clover-build-candidate-validation.json`],
            ['data-current', `${process.env.RUNNER_TEMP}/clover-data-current-validation.json`],
            ['data-candidate', `${process.env.RUNNER_TEMP}/clover-data-candidate-validation.json`],
            ['core', `${process.env.RUNNER_TEMP}/clover-core-verification.json`],
            ['activation', `${process.env.RUNNER_TEMP}/clover-core-activation-validation.json`],
            ['publication', `${process.env.RUNNER_TEMP}/clover-publication-finalization-validation.json`],
            ['gateway-health', `${process.env.RUNNER_TEMP}/clover-required-main-gate-health.json`],
            ['tool-surface', `${process.env.RUNNER_TEMP}/clover-required-main-gate-tool-surface.json`],
            ['command-inventory', `${process.env.RUNNER_TEMP}/clover-required-main-gate-command-inventory.json`],
            ['validation-summary', `${process.env.RUNNER_TEMP}/clover-required-main-gate-summary.json`]
          ];
          const files = entries.map(([name, path]) => {
            const evidencePath = path.startsWith(process.env.RUNNER_TEMP) ? path.slice(process.env.RUNNER_TEMP.length + 1) : path;
            if (!fs.existsSync(path)) return { name, path: evidencePath, present: false, bytes: null, sha256: null };
            const bytes = fs.readFileSync(path);
            return {
              name,
              path: evidencePath,
              present: true,
              bytes: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex')
            };
          });
          const missing = files.filter((file) => !file.present).map((file) => file.name);
          if (process.env.CLOVER_JOB_STATUS === 'success' && missing.length) throw new Error(`successful job is missing evidence: ${missing.join(', ')}`);
          process.stdout.write(`${JSON.stringify({
            schemaVersion: 'clover-required-main-gate-evidence-manifest-v1',
            jobStatusBeforeManifest: process.env.CLOVER_JOB_STATUS,
            complete: missing.length === 0,
            missing,
            files
          }, null, 2)}\n`);
          NODE

      - name: Upload deterministic required-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clover-required-main-gate-node-${{ matrix.node-version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .github/workflows/clover-required-main-gate.yml
            apps/clover-context-gateway/package-lock.json
            ${{ runner.temp }}/clover-pr-integration-context.json
            ${{ runner.temp }}/clover-workflow-policy.json
            ${{ runner.temp }}/clover-source-integrity.json
            ${{ runner.temp }}/clover-privacy-result.json
            ${{ runner.temp }}/clover-authority-boundary.json
            ${{ runner.temp }}/clover-master-plan-validation.json
            ${{ runner.temp }}/clover-registry-v2-validation.json
            ${{ runner.temp }}/clover-build-current-validation.json
            ${{ runner.temp }}/clover-build-candidate-validation.json
            ${{ runner.temp }}/clover-data-current-validation.json
            ${{ runner.temp }}/clover-data-candidate-validation.json
            ${{ runner.temp }}/clover-core-verification.json
            ${{ runner.temp }}/clover-core-activation-validation.json
            ${{ runner.temp }}/clover-publication-finalization-validation.json
            ${{ runner.temp }}/clover-required-main-gate-health.json
            ${{ runner.temp }}/clover-required-main-gate-tool-surface.json
            ${{ runner.temp }}/clover-required-main-gate-command-inventory.json
            ${{ runner.temp }}/clover-required-main-gate-summary.json
            ${{ runner.temp }}/clover-required-main-gate-evidence-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
